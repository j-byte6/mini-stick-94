<title>Mini Stick '94</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one 16-bit console screen at a time (title, setup, bracket, faceoff, stats), bevelled blue menu panels on a scanlined navy field. Single dark look on purpose. */
:root{
  --navy:#050a33; --deep:#0b1663; --panel:#1b2e9c; --panel2:#13207a;
  --hi:#5c78ee; --lo:#040a3f; --ink:#f3f5ff; --dim:#9db0ff;
  --gold:#f8d838; --red:#ec3a3a; --ice:#e4ecff; --ok:#46d67a;
  --pix:"Press Start 2P", "Courier New", monospace;
  --txt:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--navy);
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 50% 0%, #142283 0%, var(--navy) 70%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--txt); font-size:20px; line-height:1.15;
}
#app{max-width:1340px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,.pix{font-family:var(--pix);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000}
h3{font-size:11px;color:var(--dim)}
p{margin:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000, 6px 6px 0 rgba(0,0,0,.45);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--dim)}
.warn{color:var(--gold)}
.bad{color:var(--red)}
.btn{font-family:var(--pix);font-size:11px;line-height:1.3;color:var(--gold);background:var(--deep);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:10px 14px 10px 26px;cursor:pointer;position:relative;text-transform:uppercase;text-align:left}
.btn::before{content:"\25B6";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;opacity:0}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--navy);outline:none}
.btn:hover::before,.btn:focus-visible::before{opacity:1;animation:blink .7s steps(1) infinite}
.btn.primary{background:var(--red);color:#fff;border-color:#ff8a8a #6a0d0d #6a0d0d #ff8a8a}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--gold);color:var(--navy)}
.btn.small{font-size:9px;padding:7px 10px 7px 22px}
.btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--deep);color:var(--dim)}
.btn[disabled]::before{opacity:0}
.btn.on{background:var(--gold);color:var(--navy)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
input,select{font-family:var(--txt);font-size:20px;color:var(--ink);background:var(--lo);border:2px solid var(--hi);padding:4px 8px;min-width:0;max-width:100%}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:18px;color:var(--dim)}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--pix);font-size:13px;color:var(--gold);text-shadow:2px 2px 0 var(--red),4px 4px 0 #000;cursor:pointer;background:none;border:0;padding:0}
.bar .tname{font-size:22px;color:var(--ink)}
.save{font-family:var(--pix);font-size:8px;color:var(--ok)}
.save.local{color:var(--gold)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* title screen */
.title{align-items:center;text-align:center;gap:22px;padding-block:34px}
.title h1{font-size:clamp(26px,7vw,54px);color:var(--gold);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;line-height:1.2}
.title .sub{font-family:var(--pix);font-size:clamp(11px,2.6vw,16px);color:var(--ice);text-shadow:2px 2px 0 #000}
.press{font-family:var(--pix);font-size:10px;color:var(--ink);animation:blink 1.2s steps(1) infinite}
.rink{width:min(420px,100%);aspect-ratio:2.2/1;max-width:100%;background:var(--ice);border:4px solid #000;border-radius:60px/27%;position:relative;box-shadow:0 0 0 3px var(--hi)}
.rink i{position:absolute;top:0;bottom:0;width:6px}
.rink .red{left:calc(50% - 3px);background:var(--red)}
.rink .b1{left:33%;background:#2149d8}.rink .b2{right:33%;background:#2149d8}
.rink .g1{left:9%;width:2px;background:var(--red)}.rink .g2{right:9%;width:2px;background:var(--red)}
.rink b{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:3px solid #2149d8;border-radius:50%;transform:translate(-50%,-50%)}
.rink .puck{position:absolute;width:14px;height:9px;background:#000;border-radius:50%;top:46%;left:20%;animation:slide 3.2s ease-in-out infinite alternate}
@keyframes slide{to{left:76%;top:58%}}
.menu{display:flex;flex-direction:column;gap:10px;min-width:min(320px,100%)}
.menu .btn{font-size:12px}

/* setup */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{font-family:var(--pix);font-size:9px;padding:6px 8px;border:2px solid var(--hi);color:var(--dim)}
.step.cur{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chip{display:inline-block;width:14px;height:14px;border:2px solid #000;vertical-align:-2px;margin-right:6px}
.confs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.slot .seed{font-family:var(--pix);font-size:9px;color:var(--dim)}
.pair{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px dashed rgba(157,176,255,.35)}
.pair.clash{border-color:var(--gold)}
.orow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:20px}

.slot .btn.mv,.orow .btn.mv{padding:6px 8px;font-size:9px}
.btn.mv::before{display:none}
.draftorder{display:flex;flex-direction:column;gap:8px;max-width:520px}
.dpick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-family:var(--txt);font-size:19px;color:var(--ink);background:var(--deep);border:2px solid var(--panel);padding:5px 8px;cursor:pointer;min-width:0}
.dpick .seed{font-family:var(--pix);font-size:9px;color:var(--gold);min-width:24px}
.dpick:hover:not([disabled]),.dpick:focus-visible{border-color:var(--gold);outline:none;background:var(--panel)}
.dpick.taken{opacity:.6;cursor:default}
.dpick[disabled]{cursor:default}
.clock{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:rgba(0,0,0,.3);border:3px solid var(--gold);padding:10px 14px}
.clock .pix{font-size:10px;color:var(--gold);animation:blink 1.2s steps(1) infinite}
.clock .who{font-family:var(--pix);font-size:16px}
.board{margin:0;padding-left:28px;columns:2 260px;font-size:19px}
.board li{margin-bottom:4px;break-inside:avoid}
.mrow .sd{font-family:var(--pix);font-size:7px;color:var(--dim);min-width:10px}

.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sizebtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;background:var(--deep);color:var(--ink);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;font-family:var(--txt);font-size:18px;text-align:center}
.sizebtn .num{font-family:var(--pix);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #000}
.sizebtn .pix{font-size:10px}
.sizebtn:hover,.sizebtn:focus-visible{border-color:var(--gold);outline:none}
.sizebtn.on{background:var(--gold);color:var(--navy);border-color:#000}
.sizebtn.on .num{color:var(--navy);text-shadow:none}
.sizebtn.on .muted{color:var(--navy)}

/* team badge */
.badge{display:inline-grid;place-items:center;min-width:46px;height:26px;padding:0 4px;font-family:var(--pix);font-size:9px;color:var(--c2);background:var(--c1);border:2px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);flex:none}
.badge.big{min-width:96px;height:56px;font-size:18px;border-width:3px}

/* bracket */
.bwrap{overflow-x:auto;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:10px;min-width:1260px;align-items:stretch}
.bcol{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.bcol h3{text-align:center;font-size:8px;min-height:20px}
.match{display:flex;flex-direction:column;background:var(--lo);border:2px solid var(--hi);padding:0;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--txt);width:100%}
.match:hover,.match:focus-visible{border-color:var(--gold);outline:none;box-shadow:0 0 0 2px var(--gold)}
.match[disabled]{cursor:default;opacity:.55;box-shadow:none;border-color:var(--hi)}
.mrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center;padding:4px 6px;font-size:18px;min-width:0}
.mrow + .mrow{border-top:1px solid rgba(157,176,255,.25)}
.mrow .who{font-size:16px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sc{font-family:var(--pix);font-size:12px;min-width:20px;text-align:right}
.mrow.win{background:rgba(248,216,56,.14)}
.mrow.win .sc{color:var(--gold)}
.mrow.lose{opacity:.55}
.mfoot{font-family:var(--pix);font-size:7px;color:var(--dim);padding:4px 6px;background:rgba(0,0,0,.25)}
.mfoot.alert{color:var(--navy);background:var(--gold)}
.cup{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.trophy{width:56px;height:70px;position:relative}
.trophy::before{content:"";position:absolute;left:12px;right:12px;top:0;height:30px;background:linear-gradient(90deg,#9aa4b8,#f1f4fa,#9aa4b8);border-radius:0 0 50% 50%}
.trophy::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:38px;background:repeating-linear-gradient(180deg,#c9d0dd 0 6px,#8c95a8 6px 8px);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.champ{font-family:var(--pix);font-size:10px;color:var(--gold);line-height:1.6}
.banner{background:var(--gold);color:var(--navy);border:3px solid #000;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner .pix{font-size:10px}

/* faceoff */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.vsmid{font-family:var(--pix);font-size:22px;color:var(--red);text-shadow:2px 2px 0 #000;align-self:center}
.side{gap:12px}
.thead{display:flex;gap:12px;align-items:center}
.thead .nm{font-family:var(--pix);font-size:12px;line-height:1.5}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:4px;background:rgba(0,0,0,.25);border:2px solid var(--lo)}
.pbtn{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;text-align:left;font-family:var(--txt);font-size:18px;color:var(--ink);background:var(--deep);border:2px solid var(--panel);padding:3px 6px;cursor:pointer;min-width:0}
.pbtn .n{font-family:var(--pix);font-size:8px;color:var(--dim)}
.pbtn .p{font-family:var(--pix);font-size:7px;color:var(--dim)}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn:hover,.pbtn:focus-visible{border-color:var(--gold);outline:none}
.pbtn.sel{background:var(--gold);color:var(--navy);border-color:#000}
.pbtn.sel .n,.pbtn.sel .p{color:var(--navy)}
.pbtn[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:10px 6px;text-align:center;min-width:0}
.pcard h3{font-size:8px}
.shot{width:100%;max-width:120px;aspect-ratio:1;background:linear-gradient(180deg,#9fb6ff,#4f6fd8);border:3px solid #000;position:relative;overflow:hidden;image-rendering:auto}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .head{position:absolute;left:50%;top:16%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--c1);transform:translateX(-50%);border:3px solid #000}
.shot .body{position:absolute;left:14%;right:14%;bottom:-6%;height:42%;background:var(--c1);border:3px solid #000;border-radius:40% 40% 0 0;display:grid;place-items:center;font-family:var(--pix);font-size:16px;color:var(--c2)}
.shot.none{background:repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 6px,transparent 6px 12px),var(--lo)}
.shot.none .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pix);font-size:22px;color:var(--dim)}
.pcard .pn{font-family:var(--pix);font-size:9px;line-height:1.5;color:var(--gold);overflow-wrap:anywhere}
.pcard .pm{font-size:17px;color:var(--dim)}
.score{display:flex;align-items:center;gap:10px}
.score output{font-family:var(--pix);font-size:34px;color:var(--gold);min-width:64px;text-align:center;text-shadow:3px 3px 0 #000}
.issues{display:flex;flex-direction:column;gap:4px;font-size:19px}
details summary{cursor:pointer;color:var(--dim);font-size:18px}
.addp{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px}

/* stats */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th{font-family:var(--pix);font-size:8px;color:var(--gold);text-align:left;padding:8px 8px;border-bottom:3px solid var(--hi);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid rgba(157,176,255,.18);white-space:nowrap}
td.num,th.num{text-align:right}
tr:nth-child(even) td{background:rgba(0,0,0,.18)}
.empty{color:var(--dim);font-size:20px;padding:10px 0}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cand{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--deep);border:2px solid var(--panel);color:var(--ink);font-family:var(--txt);font-size:19px;padding:8px;cursor:pointer}
.cand:hover,.cand:focus-visible{border-color:var(--gold);outline:none}
.cand.sel{background:var(--gold);color:var(--navy)}
.cand b{font-family:var(--pix);font-size:9px;font-weight:400}
.ideas{font-size:19px;display:flex;flex-direction:column;gap:4px}

@media (max-width:760px){
  .vs{grid-template-columns:1fr}
  .vsmid{justify-self:center}
  .bar .tname{font-size:20px;width:100%;order:3}
  .nav{margin-left:0}
}
</style>

<div id="app"></div>

  UTA:["Utah","Mammoth","W","#6CACE4","#111111"], WPG:["Winnipeg","Jets","W","#041E42","#FFFFFF"],
  ANA:["Anaheim","Ducks","W","#F47A38","#111111"], CGY:["Calgary","Flames","W","#C8102E","#F1BE48"],
  EDM:["Edmonton","Oilers","W","#041E42","#FF4C00"], LAK:["Los Angeles","Kings","W","#111111","#FFFFFF"],
  SJS:["San Jose","Sharks","W","#006D75","#FFFFFF"], SEA:["Seattle","Kraken","W","#001628","#99D9D9"],
  VAN:["Vancouver","Canucks","W","#00205B","#FFFFFF"], VGK:["Vegas","Golden Knights","W","#B4975A","#111111"]
};
const WEST = Object.keys(TEAMS).filter(k=>TEAMS[k][2]==="W").sort();
const EAST = Object.keys(TEAMS).filter(k=>TEAMS[k][2]==="E").sort();
const PCOLORS = ["#ff4a4a","#46a0ff","#f8d838","#46d67a"];
const ROUND_NAMES = ["Round 1","Conference Semifinal","Conference Final","Stanley Cup Final"];
const KEY = "ministick94.v1";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const teamName = ab => TEAMS[ab] ? TEAMS[ab][1] : "—";
const badge = (ab, big) => ab ? `<span class="badge${big?" big":""}" style="--c1:${TEAMS[ab][3]};--c2:${TEAMS[ab][4]}">${ab}</span>` : `<span class="badge${big?" big":""}" style="--c1:#222a55;--c2:#9db0ff">TBD</span>`;

function roster(ab){
  const base = (ROSTER_RAW[ab]||"").split(";").filter(Boolean);
  const extra = (state && state.custom && state.custom[ab]) || [];
  return base.concat(extra).map(s => {
    const [pos,num,name] = s.split("|");
    return { id: ab+"|"+pos+"|"+num+"|"+name, pos, num, name, g: pos==="G", d: pos==="D" };
  });
}
const pName = id => id ? id.split("|")[3] : "";
const pPos = id => id ? id.split("|")[1] : "";

/* bracket geometry for 4, 8 or 16 teams. Games are numbered round by round; within a round
   the first half is West and the second half East. The last game (SIZE-2) is the Cup final.
   For 16 teams: 0-7 R1, 8-11 R2, 12-13 conference finals, 14 Cup final. */
const SIZE = () => (state && state.size) || 16;
const CONF = () => SIZE()/2;
const ROUNDS = () => Math.log2(SIZE());
const NGAMES = () => SIZE()-1;
const FINAL = () => SIZE()-2;
const rcount = r => SIZE()/2**(r+1);
const rstart = r => { let s=0; for (let k=0;k<r;k++) s+=rcount(k); return s; };
const roundOf = g => { let r=0; while (r<ROUNDS()-1 && g>=rstart(r+1)) r++; return r; };
const idxIn = g => g - rstart(roundOf(g));
const feeders = g => { const r=roundOf(g); if (r===0) return null; const i=idxIn(g), s=rstart(r-1); return [s+2*i, s+2*i+1]; };
const nextOf = g => { const r=roundOf(g); return r===ROUNDS()-1 ? null : rstart(r+1)+Math.floor(idxIn(g)/2); };
const confOf = g => g===FINAL() ? "F" : (idxIn(g) < rcount(roundOf(g))/2 ? "W" : "E");
const gameNo = g => confOf(g)==="E" ? idxIn(g)-rcount(roundOf(g))/2+1 : idxIn(g)+1;
const roundName = r => ROUND_NAMES[4-ROUNDS()+r];

/* headshots: optional headshots.json published beside the page, keyed "TEAM|Full Name" */
let HEADSHOTS = {};
fetch("headshots.json").then(r=>r.ok?r.json():{}).then(j=>{ HEADSHOTS=j||{}; if (ui.view==="game") keepScroll(); }).catch(()=>{});
function shot(id, team){
  if (!id) return `<div class="shot none"><span class="q">?</span></div>`;
  const [ab,pos,num,name] = id.split("|");
  const src = HEADSHOTS[ab+"|"+name];
  const c = `--c1:${TEAMS[team][3]};--c2:${TEAMS[team][4]}`;
  return src ? `<div class="shot" style="${c}"><img src="${esc(src)}" alt="${esc(name)}"></div>`
             : `<div class="shot" style="${c}" aria-hidden="true"><span class="head"></span><span class="body">${esc(num)}</span></div>`;
}
function pickCard(label, id, team){
  return `<div class="pcard"><h3>${label}</h3>${shot(id, team)}
    <span class="pn">${id?esc(pName(id)).toUpperCase():"NOT PICKED"}</span>
    <span class="pm">${id?(pPos(id)==="G"?"Goalie":pPos(id)==="D"?"Defense":"Forward")+(id.split("|")[2]?" · #"+esc(id.split("|")[2]):""):"Choose below"}</span></div>`;
}

/* ---------- state ---------- */
let state = null;
const ui = { view:"title", gid:null, draft:null, tab:"players", confirmNew:false };
let db = null, dbReady = false, saveTimer = null, savedRemote = false, myDoc = null;

function blank(){
  return { v:2, size:16, draftOrder:[], snake:true, picks:[], name:"Basement Cup", createdAt:Date.now(), updatedAt:Date.now(), sample:false, stage:"setup", step:1,
    players:[{name:"Player 1"},{name:"Player 2"}],
    entries:Array.from({length:16},()=>({team:null,owner:null})), games:{}, custom:{}, conn:null };
}

/* round 1 pairings by conference size: 1v8, 4v5, 2v7, 3v6 / 1v4, 2v3 / 1v2 */
const SEEDPAIRS = {8:[[0,7],[3,4],[1,6],[2,5]], 4:[[0,3],[1,2]], 2:[[0,1]]};
function entryOf(g, side){
  if (g<rcount(0)){
    if (state.v<2) return 2*g+side;
    const half = rcount(0)/2, west = g<half;
    return (west?0:CONF()) + SEEDPAIRS[CONF()][west?g:g-half][side];
  }
  const f = feeders(g)[side];
  return winnerEntry(f);
}
function winnerEntry(g){
  const gm = state.games[g];
  if (!gm || gm.status!=="final") return null;
  const w = gm.sides[0].score > gm.sides[1].score ? 0 : 1;
  return entryOf(g, w);
}
function controller(g, side){
  const gm = state.games[g];
  if (gm && gm.sides[side] && gm.sides[side].owner!=null) return gm.sides[side].owner;
  const e = entryOf(g, side);
  return e==null ? null : state.entries[e].owner;
}
function usedSkaters(exceptGid){
  const m = {};
  for (const [gid, gm] of Object.entries(state.games)){
    if (+gid===exceptGid) continue;
    gm.sides.forEach((s,i)=>{ if (s.skater) m[s.skater] = {gid:+gid}; });
  }
  return m;
}
function locked(g){
  const n = nextOf(g);
  return n!=null && !!state.games[n];
}

function migrate(s){
  if (!s.picks){ s.picks = []; s.snake = true; s.draftOrder = []; }
  if (!s.size){ s.size = 16; if (s.stage==="setup") s.step = (s.step||1) + 1; }
}

/* ---------- persistence ---------- */
function persist(){
  state.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 350);
}
async function pushRemote(){
  if (!myDoc) return;
  try {
    await myDoc.set({ json: JSON.stringify(state), updatedAt: state.updatedAt });
    savedRemote = true;
  } catch(e){ savedRemote = false; }
  const el = $(".save"); if (el) el.outerHTML = saveTag();
}
function saveTag(){
  return savedRemote ? `<span class="save" title="Saved to your claude.ai account">● SAVED</span>`
                     : `<span class="save local" title="Saved in this browser only. Sign in to claude.ai to keep it across devices.">● SAVED ON THIS DEVICE</span>`;
}
function loadLocal(){
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
async function connectDb(){
  try {
    if (!window.claude || !window.claude.use) return;
    /* each viewer gets their own private save under data/users/<their id> */
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!dbNs || !user) return;
    db = dbNs;
    const uid = await user.id();
    if (!uid) return;
    myDoc = db.collection("data/users/"+uid).doc("tournament");
    let snap = await myDoc.get();
    if (!snap.exists && user.isOwner()){
      /* the owner's tournament from before per-person saves */
      try { const old = await db.doc("tournaments/current").get(); if (old.exists) snap = old; } catch(e) {}
    }
    if (snap.exists){
      const d = snap.data();
      const remote = JSON.parse(d.json);
      if (!state || (remote.updatedAt||0) > (state.updatedAt||0)){
        state = remote;
        migrate(state);
        try { localStorage.setItem(KEY, d.json); } catch(e) {}
        if (ui.view==="title") render(); else render();
      }
      savedRemote = true;
    } else if (state){
      await pushRemote();
    }
    const el = $(".save"); if (el) el.outerHTML = saveTag();
  } catch(e) { /* stay on local storage */ }
}

/* ---------- views ---------- */

  else if (ui.view==="setup") h = vTop() + vSetup();
  else if (ui.view==="bracket") h = vTop() + vBracket();
  else if (ui.view==="game") h = vTop() + vGame();
  else if (ui.view==="stats") h = vTop() + vStats();
  else if (ui.view==="conn") h = vTop() + vConn();
  app.innerHTML = h;
}

/* setup */
function vSetup(){
  const st = state.step;
  const steps = ["Size","Players","Teams & seeds","Draft order","Draft"].map((s,i)=>`<span class="step${st===i+1?" cur":""}">${i+1}. ${s}</span>`).join("");
  let body = "";
  if (st===1){
    const picked = state.entries.some(e=>e.team);
    body = `<h2>HOW BIG IS THE TOURNAMENT?</h2>
    <p class="muted">Half the teams play in the West and half in the East. The conference champions meet in the Stanley Cup Final.</p>
    <div class="sizes">${[4,8,16].map(n=>`<button class="sizebtn${SIZE()===n?" on":""}" data-act="size" data-n="${n}">
      <span class="num">${n}</span><span class="pix">TEAMS</span>
      <span class="muted">${n/2} per conference · ${Math.log2(n)} rounds · ${n-1} games</span></button>`).join("")}</div>
    ${picked?`<p class="warn">Changing the size clears the teams and draft you've set up.</p>`:""}

  } else if (st===2){
    const n = state.players.length;
    body = `<h2>WHO'S PLAYING?</h2>

    <div class="row"><span class="muted">Number of players</span>${[2,3,4].map(k=>`<button class="btn small${n===k?" on":""}" data-act="nplayers" data-n="${k}">${k}</button>`).join("")}</div>
    <div class="pgrid">${state.players.map((p,i)=>`<label><span><i class="chip" style="background:${PCOLORS[i]}"></i>Player ${i+1}</span><input id="pname${i}" data-in="pname" data-i="${i}" value="${esc(p.name)}" maxlength="16"></label>`).join("")}</div>
    <div class="row"><button class="btn" data-act="step" data-s="1">Back</button><span class="grow"></span><button class="btn primary" data-act="step" data-s="3">Next: pick teams</button></div>`;
  } else if (st===3){
    const conf = (label, list, off) => `<div class="panel" style="background:rgba(0,0,0,.2)">
      <h2>${label} CONFERENCE</h2>
      ${Array.from({length:CONF()},(_,i)=>i).map(i=>{ const e=state.entries[off+i]; return `<div class="slot"><span class="seed">#${i+1}</span>
        <div class="row" style="gap:6px;flex-wrap:nowrap">${badge(e.team)}<select id="team${off+i}" data-in="team" data-i="${off+i}" class="grow" aria-label="${label} seed ${i+1}">
        <option value="">Pick a team</option>${list.map(t=>`<option value="${t}"${e.team===t?" selected":""}>${TEAMS[t][0]} ${TEAMS[t][1]}</option>`).join("")}</select>
        <button class="btn small mv" data-act="move" data-i="${off+i}" data-d="-1"${i===0?" disabled":""} aria-label="Move up">▲</button><button class="btn small mv" data-act="move" data-i="${off+i}" data-d="1"${i===CONF()-1?" disabled":""} aria-label="Move down">▼</button></div></div>`; }).join("")}
      <div class="row"><button class="btn small" data-act="randconf" data-c="${off}">Random ${CONF()}</button><button class="btn small" data-act="randconf" data-c="${off}" data-rep="1">Random, repeats OK</button></div>
    </div>`;
    const missing = state.entries.filter(e=>!e.team).length;
    const pairText = {8:"Round 1 is 1 vs 8, 2 vs 7, 3 vs 6 and 4 vs 5, so the top seeds can't meet until later.", 4:"Round 1 is 1 vs 4 and 2 vs 3.", 2:"The two teams play for the conference title."}[CONF()];
    body = `<h2>PICK AND RANK ${SIZE()} TEAMS</h2>
    <p class="muted">Rank each conference 1 to ${CONF()} with the arrows. ${pairText} The same NHL team can be entered twice, but its skaters are shared: once one is used he's gone for both.</p>
    ${state.picks.length?`<p class="warn">Changing teams or seeds restarts the draft.</p>`:""}
    <div class="row"><button class="btn small" data-act="randall">Random all ${SIZE()}</button><button class="btn small" data-act="clearteams">Clear</button></div>
    <div class="confs">${conf("WEST", WEST, 0)}${conf("EAST", EAST, CONF())}</div>
    <div class="row"><button class="btn" data-act="step" data-s="2">Back</button><span class="grow"></span>
      ${missing?`<span class="warn">${missing} slot${missing>1?"s":""} still empty</span>`:""}
      <button class="btn primary" data-act="step" data-s="4"${missing?" disabled":""}>Next: draft order</button></div>`;
  } else if (st===4){
    fixOrder();
    const n = state.players.length;
    const seq = Array.from({length:Math.min(2*n,SIZE())},(_,p)=>state.players[onClock(p)].name);
    body = `<h2>DRAFT ORDER</h2>

      <span><i class="chip" style="background:${PCOLORS[pi]}"></i>${esc(state.players[pi].name)}</span>
      <span class="row" style="gap:6px"><button class="btn small mv" data-act="ordmove" data-k="${k}" data-d="-1"${k===0?" disabled":""} aria-label="Move up">▲</button><button class="btn small mv" data-act="ordmove" data-k="${k}" data-d="1"${k===n-1?" disabled":""} aria-label="Move down">▼</button></span></div>`).join("")}</div>
    <div class="row"><span class="muted">Style</span>
      <button class="btn small${state.snake?" on":""}" data-act="snake" data-v="1">Snake</button>

    ${SIZE()%n?`<p class="muted">${SIZE()} teams don't split evenly between ${n}, so the first ${SIZE()%n} in the order get one extra team.</p>`:""}
    <div class="row"><button class="btn" data-act="step" data-s="3">Back</button><span class="grow"></span>
      <button class="btn primary" data-act="step" data-s="5">Start the draft</button></div>`;
  } else {
    fixOrder();
    const done = state.picks.length>=SIZE();
    const cur = done ? null : onClock(state.picks.length);
    const counts = state.players.map((_,i)=>state.entries.filter(e=>e.owner===i).length);
    const pool = (label, off) => `<div class="panel" style="background:rgba(0,0,0,.2)"><h2>${label}</h2>

    <div class="row"><button class="btn" data-act="step" data-s="4">Back</button>
      ${state.picks.length&&!done?`<button class="btn small" data-act="undopick">Undo last pick</button>`:""}
      ${!done?`<button class="btn small" data-act="autodraft">Auto-pick the rest</button>`:`<button class="btn small" data-act="undopick">Undo last pick</button>`}
      <span class="grow"></span>
      <button class="btn primary" data-act="start"${done?"":" disabled"}>Drop the puck</button></div>`;
  }
  return `<section class="panel"><div class="steps">${steps}</div>${body}</section>`;
}

/* bracket */
function matchCard(g){
  const gm = state.games[g];
  const ents = [entryOf(g,0), entryOf(g,1)];
  const ready = ents[0]!=null && ents[1]!=null;
  const final = gm && gm.status==="final";
  const win = final ? (gm.sides[0].score>gm.sides[1].score?0:1) : null;
  const ctrl = [controller(g,0), controller(g,1)];
  const clash = ready && !final && ctrl[0]!=null && ctrl[0]===ctrl[1];
  const rows = [0,1].map(s=>{
    const e = ents[s]; const ent = e!=null ? state.entries[e] : null;
    const who = ent ? state.players[ctrl[s]] : null;
    const pick = gm && gm.sides[s].skater ? " · "+esc(pName(gm.sides[s].skater).split(" ").slice(-1)[0]) : "";
    return `<div class="mrow${final?(win===s?" win":" lose"):""}"><span class="sd">${e!=null&&state.v>=2?e%CONF()+1:""}</span>${badge(ent&&ent.team)}
      <span class="who" style="color:${who?PCOLORS[ctrl[s]]:"var(--dim)"}">${who?esc(who.name)+pick:"Winner of "+(g<8?"":"G"+(feeders(g)[s]+1))}</span>
      <span class="sc">${final?gm.sides[s].score:""}</span></div>`;
  }).join("");
  const foot = final ? `FINAL${gm.ot?" / OT":""}` : clash ? "SAME PLAYER · TAP TO SWAP" : gm ? "LINEUP SET" : ready ? "TAP TO PLAY" : "WAITING";
  return `<button class="match" data-act="open" data-g="${g}"${ready?"":" disabled"} aria-label="Game ${g+1}">${rows}<div class="mfoot${clash?" alert":""}">G${g+1} · ${foot}</div></button>`;
}
function vBracket(){
  const col = (title, ids) => `<div class="bcol"><h3>${title}</h3>${ids.map(matchCard).join("")}</div>`;
  const F = FINAL();
  const champE = winnerEntry(F);
  const champ = champE!=null ? state.entries[champE] : null;
  const champOwner = champ ? state.players[controller(F, state.games[F].sides[0].score>state.games[F].sides[1].score?0:1)] : null;
  const cupCol = `<div class="bcol"><h3>STANLEY CUP FINAL</h3>${matchCard(F)}
    <div class="cup"><div class="trophy" aria-hidden="true"></div>
    ${champ?`<p class="champ">${esc(TEAMS[champ.team][0]+" "+TEAMS[champ.team][1]).toUpperCase()}<br>WIN THE CUP!</p><p>${esc(champOwner.name)} takes it.</p>
      <button class="btn small" data-act="go" data-v="conn">${state.conn?"Conn Smythe: "+esc(pName(state.conn)):"Pick the Conn Smythe"}</button>`:`<p class="muted">Champion crowned here</p>`}
    </div></div>`;
  const R = ROUNDS();
  const half = (r, west) => { const s=rstart(r), h=rcount(r)/2; return Array.from({length:h},(_,i)=>s+(west?i:h+i)); };
  const label = (r, west) => (west?"WEST":"EAST")+" · "+["ROUND 1","SEMIS","FINAL"][r+4-R];
  const west = [], east = [];
  for (let r=0; r<R-1; r++){ west.push(col(label(r,true), half(r,true))); east.unshift(col(label(r,false), half(r,false))); }
  const ncols = 2*(R-1)+1;
  return `<section class="panel">
    <div class="row"><h2>PLAYOFF BRACKET · ${SIZE()} TEAMS</h2><span class="grow"></span><span class="muted">Tap a game to set lineups and enter the score.</span></div>
    <div class="bwrap"><div class="bracket" style="grid-template-columns:repeat(${ncols},minmax(172px,1fr));min-width:${ncols*180}px">
      ${west.join("")}${cupCol}${east.join("")}
    </div></div>
  </section>`;
}

/* faceoff / game */
function openGame(g){
  const gm = state.games[g];
  ui.gid = g;
  ui.draft = gm ? JSON.parse(JSON.stringify(gm)) : { status:"lineup", ot:false,
    sides:[0,1].map(s=>({ owner: controller(g,s), skater:null, goalie:null, score:0 })) };
  ui.view = "game";
  render(); window.scrollTo(0,0);
}
function draftIssues(g){
  const d = ui.draft, out = [];
  if (d.sides[0].owner===d.sides[1].owner) out.push("Same person on both sides. Hand one team to someone else.");
  d.sides.forEach((s,i)=>{ const t = teamName(state.entries[entryOf(g,i)].team);
    if (!s.skater) out.push(`${t}: pick a skater.`);
    if (!s.goalie) out.push(`${t}: pick a goalie.`); });
  if (d.sides[0].score===d.sides[1].score) out.push("No ties in the playoffs. Someone has to win.");
  return out;
}
function vGame(){
  const g = ui.gid, d = ui.draft;
  const used = usedSkaters(g);
  const isLocked = locked(g);
  const side = s => {
    const e = state.entries[entryOf(g,s)];

      <button class="btn small" data-act="go" data-v="bracket">Back to bracket</button></div>
    ${isLocked?`<p class="warn">The next round has started, so this game is locked.</p>`:""}

    <div class="row">
      <label class="row" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="ot" data-in="ot"${d.ot?" checked":""}${isLocked?" disabled":""}> Won in overtime</label>
    </div>
    ${!isLocked && issues.length?`<div class="issues">${issues.map(i=>`<span class="warn">▸ ${esc(i)}</span>`).join("")}</div>`:""}
    ${!isLocked?`<div class="row"><button class="btn" data-act="savelineup">Save lineup only</button>
      <span class="grow"></span>

      <button class="btn primary" data-act="final"${issues.length?" disabled":""}>Final score</button></div>`:""}

/* stats */
function finals(){
  const out = [];
  for (let g=0; g<NGAMES(); g++){
    const gm = state.games[g];
    if (!gm || gm.status!=="final") continue;
    [0,1].forEach(s=>{
      const e = entryOf(g,s);
      out.push({ g, s, e, team: state.entries[e].team, owner: gm.sides[s].owner, skater: gm.sides[s].skater, goalie: gm.sides[s].goalie,
        gf: gm.sides[s].score, ga: gm.sides[1-s].score, win: gm.sides[s].score>gm.sides[1-s].score, ot: gm.ot });
    });
  }
  return out;
}
function vStats(){
  const F = finals();
  const tabs = [["players","Standings"],["skaters","Skaters"],["goalies","Goalies"],["teams","Teams"],["games","Game log"]];

  else if (ui.tab==="players"){

      const r = F.filter(x=>x.owner===i);
      const w = r.filter(x=>x.win).length, gf = r.reduce((a,x)=>a+x.gf,0), ga = r.reduce((a,x)=>a+x.ga,0);
      const alive = state.entries.some((en,ei)=>en.owner===i && isAlive(ei));
      return {p,i,gp:r.length,w,l:r.length-w,gf,ga,diff:gf-ga,so:r.filter(x=>x.win&&x.ga===0).length,ot:r.filter(x=>x.win&&x.ot).length,alive};
    }).sort((a,b)=>b.w-a.w||b.diff-a.diff||b.gf-a.gf);
    body = table(["Player","GP","W","L","GF","GA","+/-","SO","OTW","Teams left"],
      rows.map(r=>[`<i class="chip" style="background:${PCOLORS[r.i]}"></i>${esc(r.p.name)}`,r.gp,r.w,r.l,r.gf,r.ga,(r.diff>0?"+":"")+r.diff,r.so,r.ot,
        state.entries.filter((en,ei)=>en.owner===r.i && isAlive(ei)).length]));
  } else if (ui.tab==="skaters"){
    const rows = F.filter(x=>x.skater).sort((a,b)=>b.gf-a.gf||a.g-b.g);
    body = table(["Skater","Pos","Team","Played for","Game","Team goals","Result"],
      rows.map(x=>[esc(pName(x.skater)),pPos(x.skater),badge(x.team),esc(state.players[x.owner].name),"G"+(x.g+1),x.gf,x.win?"W":"L"]));
  } else if (ui.tab==="goalies"){
    const m = {};
    F.filter(x=>x.goalie).forEach(x=>{ const k=x.goalie; m[k]=m[k]||{id:k,team:x.team,gp:0,w:0,ga:0,so:0}; m[k].gp++; m[k].w+=x.win?1:0; m[k].ga+=x.ga; m[k].so+=x.ga===0?1:0; });
    const rows = Object.values(m).sort((a,b)=>(a.ga/a.gp)-(b.ga/b.gp)||b.w-a.w);
    body = table(["Goalie","Team","GP","W","L","GA","GAA","SO"],
      rows.map(r=>[esc(pName(r.id)),badge(r.team),r.gp,r.w,r.gp-r.w,r.ga,(r.ga/r.gp).toFixed(2),r.so]));
  } else if (ui.tab==="teams"){
    const rows = state.entries.map((en,ei)=>{ const r=F.filter(x=>x.e===ei); const w=r.filter(x=>x.win).length;
      return {en,ei,gp:r.length,w,gf:r.reduce((a,x)=>a+x.gf,0),ga:r.reduce((a,x)=>a+x.ga,0),alive:isAlive(ei)}; })
      .sort((a,b)=>b.w-a.w||(b.gf-b.ga)-(a.gf-a.ga));
    body = table(["Team","Owner","GP","W","L","GF","GA","Status"],
      rows.map(r=>[badge(r.en.team)+" "+esc(teamName(r.en.team)),esc(state.players[r.en.owner].name),r.gp,r.w,r.gp-r.w,r.gf,r.ga,r.alive?"Alive":"Out"]));
  } else {
    const games = []; for (let g=0; g<NGAMES(); g++){ const gm=state.games[g]; if (gm&&gm.status==="final") games.push(g); }
    body = table(["Game","Round","Winner","Score","Loser","Skaters","Goalies"],
      games.map(g=>{ const gm=state.games[g]; const w=gm.sides[0].score>gm.sides[1].score?0:1, l=1-w;
        const tw=state.entries[entryOf(g,w)].team, tl=state.entries[entryOf(g,l)].team;
        return ["G"+(g+1),roundName(roundOf(g)),badge(tw)+" "+esc(state.players[gm.sides[w].owner].name),
          `${gm.sides[w].score}–${gm.sides[l].score}${gm.ot?" OT":""}`,badge(tl)+" "+esc(state.players[gm.sides[l].owner].name),
          esc(pName(gm.sides[w].skater))+" / "+esc(pName(gm.sides[l].skater)), esc(pName(gm.sides[w].goalie))+" / "+esc(pName(gm.sides[l].goalie))]; }));
  }
  let rec = "";
  if (F.length){
    const gs=[]; for (let g=0; g<NGAMES(); g++){ const gm=state.games[g]; if (gm&&gm.status==="final") gs.push({g,m:Math.abs(gm.sides[0].score-gm.sides[1].score),t:gm.sides[0].score+gm.sides[1].score}); }
    const big = gs.slice().sort((a,b)=>b.m-a.m)[0], hi = gs.slice().sort((a,b)=>b.t-a.t)[0];
    rec = `<div class="ideas"><h3>TOURNAMENT RECORDS</h3>
      <span>Biggest win: game ${big.g+1}, by ${big.m}</span><span>Highest scoring: game ${hi.g+1}, ${hi.t} goals</span>
      <span>Shutouts: ${F.filter(x=>x.win&&x.ga===0).length} · Overtime games: ${gs.filter(x=>state.games[x.g].ot).length}</span></div>`;
  }
  return `<section class="panel"><h2>TOURNAMENT STATS</h2>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="btn small${ui.tab===k?" on":""}" data-act="tab" data-t="${k}">${l}</button>`).join("")}</div>
    <div class="tscroll">${body}</div>${rec}
    <p class="muted">Skater goals are the team's goals in the game he was picked for. Everything comes from the final scores.</p></section>`;
}
function table(head, rows){
  if (!rows.length) return `<p class="empty">Nothing here yet.</p>`;
  return `<table><thead><tr>${head.map((h,i)=>`<th${i>1?' class="num"':""}>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>1?' class="num"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function isAlive(ei){
  for (let g=0; g<NGAMES(); g++){
    const gm = state.games[g];
    if (gm && gm.status==="final"){ const w = winnerEntry(g); if ((entryOf(g,0)===ei || entryOf(g,1)===ei) && w!==ei) return false; }
  }
  return true;
}

/* Conn Smythe */
function vConn(){
  const ce = winnerEntry(FINAL());
  if (ce==null) return `<section class="panel"><p class="empty">Finish the Stanley Cup Final first.</p></section>`;
  const F = finals().filter(x=>x.e===ce);
  const sk = F.filter(x=>x.skater).map(x=>({id:x.skater, line:`${x.gf} team goals in G${x.g+1} (${x.win?"W":"L"} ${x.gf}–${x.ga})`, rank:x.gf}));
  const gm = {}; F.forEach(x=>{ if(!x.goalie) return; const k=x.goalie; gm[k]=gm[k]||{id:k,gp:0,w:0,ga:0}; gm[k].gp++; gm[k].w+=x.win?1:0; gm[k].ga+=x.ga; });
  const gl = Object.values(gm).map(r=>({id:r.id, line:`${r.w}-${r.gp-r.w}, ${(r.ga/r.gp).toFixed(2)} GAA`, rank:r.w*3-r.ga/r.gp}));
  const all = sk.concat(gl).sort((a,b)=>b.rank-a.rank);
  const team = state.entries[ce].team;
  return `<section class="panel"><div class="row"><h2>CONN SMYTHE TROPHY</h2><span class="grow"></span><button class="btn small" data-act="go" data-v="bracket">Back to bracket</button></div>
    <div class="row">${badge(team,true)}<p>Playoff MVP for the ${esc(TEAMS[team][0]+" "+TEAMS[team][1])}. Pick from the players they used this tournament. They're listed best first by the numbers.</p></div>
    <div class="cands">${all.map(c=>`<button class="cand${state.conn===c.id?" sel":""}" data-act="conn" data-id="${esc(c.id)}"><b>${esc(pName(c.id))} · ${esc(pPos(c.id))}</b><span>${esc(c.line)}</span></button>`).join("")}</div>
    ${state.conn?`<div class="banner"><span class="pix">CONN SMYTHE</span><span>${esc(pName(state.conn))}</span></div>`:""}
  </section>`;
}

/* ---------- actions ---------- */
function onClock(p){
  const n = state.players.length, order = state.draftOrder;
  const round = Math.floor(p/n), pos = p%n;
  return order[state.snake && round%2 ? n-1-pos : pos];
}
function resetDraft(){
  state.picks = []; state.entries.forEach(e=>e.owner=null);
}
function fixOrder(){
  const n = state.players.length;
  if (!state.draftOrder || state.draftOrder.length!==n || state.draftOrder.some(i=>i>=n)) state.draftOrder = Array.from({length:n},(_,i)=>i);
}
function dealOwners(){
  const n = state.players.length;
  const base = Array.from({length:SIZE()},(_,i)=>i%n);
  for (let t=0; t<800; t++){
    const o = shuffle(base);
    let ok = true; for (let k=0;k<rcount(0);k++) if (o[entryOf(k,0)]===o[entryOf(k,1)]) { ok=false; break; }
    if (ok || t===799){ o.forEach((v,i)=>state.entries[i].owner=v); return; }
  }
}
function randomConf(off, rep){
  const list = off===0?WEST:EAST;
  const pick = rep ? Array.from({length:CONF()},()=>list[Math.floor(Math.random()*list.length)]) : shuffle(list).slice(0,CONF());
  pick.forEach((t,i)=>state.entries[off+i].team=t);
}
function loadSample(){
  state = blank(); state.sample = true; state.name = "Sample Cup"; state.stage = "bracket";
  state.players = [{name:"Alex"},{name:"Jordan"},{name:"Sam"}];
  randomConf(0); randomConf(CONF()); state.draftOrder = shuffle([0,1,2]);
  while (state.picks.length<SIZE()){ const left=state.entries.map((e,i)=>i).filter(i=>state.entries[i].owner==null); const ei=left[Math.floor(Math.random()*Math.min(3,left.length))]; state.entries[ei].owner=onClock(state.picks.length); state.picks.push(ei); }
  for (const g of [0,1,4,5,2]){
    const sides = [0,1].map(s=>{ const ros = roster(state.entries[entryOf(g,s)].team); const used = usedSkaters(-1);
      const sk = shuffle(ros.filter(p=>!p.g && !used[p.id]))[0]; const gl = shuffle(ros.filter(p=>p.g))[0];
      return { owner: controller(g,s), skater: sk.id, goalie: gl.id, score: Math.floor(Math.random()*5) }; });
    if (sides[0].score===sides[1].score) sides[Math.round(Math.random())].score++;
    state.games[g] = { status:"final", ot: Math.random()<.2, sides };
  }
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a==="home"){ ui.view="title"; ui.confirmNew=false; }
  else if (a==="continue"){ ui.view = state.stage==="bracket" ? "bracket" : "setup"; }
  else if (a==="new"){
    const exists = state && (state.stage==="bracket" || state.entries.some(e=>e.team)) && !state.sample;
    if (exists && !b.dataset.sure){ ui.confirmNew = "new"; }
    else { state = blank(); ui.confirmNew=false; ui.view="setup"; persist(); }
  }
  else if (a==="cancelNew"){ ui.confirmNew=false; }
  else if (a==="sample"){
    if (state && !state.sample && (state.stage==="bracket" || state.entries.some(e=>e.team)) && !b.dataset.sure){ ui.confirmNew="sample"; }
    else { loadSample(); ui.confirmNew=false; ui.view="bracket"; persist(); }
  }
  else if (a==="go"){ ui.view = b.dataset.v; }
  else if (a==="nplayers"){
    const n = +b.dataset.n; while (state.players.length<n) state.players.push({name:"Player "+(state.players.length+1)});
    state.players.length = n; fixOrder(); resetDraft(); persist();
  }
  else if (a==="step"){ state.step = +b.dataset.s; persist(); window.scrollTo(0,0); }
  else if (a==="randconf"){ randomConf(+b.dataset.c, !!b.dataset.rep); resetDraft(); persist(); }
  else if (a==="randall"){ randomConf(0); randomConf(CONF()); resetDraft(); persist(); }
  else if (a==="size"){ const n=+b.dataset.n; if (n!==SIZE()){ state.size=n; state.entries=Array.from({length:n},()=>({team:null,owner:null})); state.games={}; state.conn=null; resetDraft(); persist(); } }
  else if (a==="clearteams"){ state.entries.forEach(e=>e.team=null); resetDraft(); persist(); }
  else if (a==="move"){ const i=+b.dataset.i, j=i+(+b.dataset.d); const E=state.entries; [E[i],E[j]]=[E[j],E[i]]; resetDraft(); persist(); }
  else if (a==="randorder"){ fixOrder(); state.draftOrder = shuffle(state.draftOrder); resetDraft(); persist(); }
  else if (a==="ordmove"){ const k=+b.dataset.k, j=k+(+b.dataset.d); const O=state.draftOrder; [O[k],O[j]]=[O[j],O[k]]; resetDraft(); persist(); }
  else if (a==="snake"){ state.snake = b.dataset.v==="1"; resetDraft(); persist(); }
  else if (a==="draft"){ const ei=+b.dataset.i; if (state.entries[ei].owner==null && state.picks.length<SIZE()){ state.entries[ei].owner = onClock(state.picks.length); state.picks.push(ei); persist(); } }
  else if (a==="undopick"){ const ei=state.picks.pop(); if (ei!=null) state.entries[ei].owner=null; persist(); }
  else if (a==="autodraft"){ while (state.picks.length<SIZE()){ const left=state.entries.map((e,i)=>i).filter(i=>state.entries[i].owner==null); const ei=shuffle(left)[0]; state.entries[ei].owner=onClock(state.picks.length); state.picks.push(ei); } persist(); }
  else if (a==="start"){ state.stage="bracket"; ui.view="bracket"; persist(); window.scrollTo(0,0); }
  else if (a==="open"){ openGame(+b.dataset.g); return; }
  else if (a==="pick"){ const s=+b.dataset.s, k=b.dataset.k; ui.draft.sides[s][k] = ui.draft.sides[s][k]===b.dataset.id ? null : b.dataset.id; keepScroll(); return; }
  else if (a==="score"){ const s=+b.dataset.s; ui.draft.sides[s].score = Math.max(0, Math.min(99, ui.draft.sides[s].score + (+b.dataset.d))); keepScroll(); return; }
  else if (a==="addp"){
    const s=b.dataset.s, t=b.dataset.t, name=$("#aname"+s).value.trim().replace(/[|;]/g,""), num=$("#anum"+s).value.replace(/\D/g,""), pos=$("#apos"+s).value;
    if (!name) { $("#aname"+s).focus(); return; }
    state.custom[t] = state.custom[t]||[]; state.custom[t].push(pos+"|"+num+"|"+name); persist(); keepScroll(); return;
  }
  else if (a==="savelineup"){ const d=ui.draft; d.status = state.games[ui.gid]&&state.games[ui.gid].status==="final" ? "final" : "lineup";
    if (d.status==="final" && draftIssues(ui.gid).length) d.status="lineup";
    state.games[ui.gid]=JSON.parse(JSON.stringify(d)); persist(); ui.view="bracket"; }
  else if (a==="final"){ ui.draft.status="final"; state.games[ui.gid]=JSON.parse(JSON.stringify(ui.draft)); persist();
    ui.view = ui.gid===FINAL() ? "conn" : "bracket"; }
  else if (a==="cleargame"){ delete state.games[ui.gid]; persist(); ui.view="bracket"; }
  else if (a==="tab"){ ui.tab=b.dataset.t; }
  else if (a==="conn"){ state.conn = b.dataset.id; persist(); }
  render();
});
function keepScroll(){
  const lists = [...document.querySelectorAll(".plist")].map(el=>el.scrollTop);
  const y = window.scrollY; render(); window.scrollTo(0,y);
  document.querySelectorAll(".plist").forEach((el,i)=>el.scrollTop=lists[i]||0);
}
document.addEventListener("change", ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  if (k==="team"){ state.entries[+t.dataset.i].team = t.value||null; resetDraft(); persist(); render(); }
  else if (k==="ctrl"){ ui.draft.sides[+t.dataset.s].owner = +t.value; keepScroll(); }
  else if (k==="ot"){ ui.draft.ot = t.checked; }
});
document.addEventListener("input", ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  if (k==="tname"){ state.name = t.value || "Tournament"; persist(); const n=$(".bar .tname"); if (n) n.textContent=state.name; }
  else if (k==="pname"){ state.players[+t.dataset.i].name = t.value || "Player "+(+t.dataset.i+1); persist(); }
});

/* boot */
state = loadLocal();
if (!state){ state = blank(); }
migrate(state);
render();
connectDb();
</script>

<meta charset="utf-8">
<title>Barnburner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one 16-bit console screen at a time (title, setup, bracket, faceoff, stats), bevelled blue menu panels on a scanlined navy field. Single dark look on purpose.
   Barnburner brand: fire (orange/red) against ice (pale blue). The West half of the bracket is the Fire side, the East half the Ice side. */
:root{
  --navy:#050a33; --deep:#0b1663; --panel:#1b2e9c; --panel2:#13207a;
  --hi:#5c78ee; --lo:#040a3f; --ink:#f3f5ff; --dim:#9db0ff;
  --gold:#f8d838; --red:#ec3a3a; --ice:#e4ecff; --ok:#46d67a;
  --fire:#ff7a1a; --ember:#ff3d1f; --frost:#7fd4ff;
  --pix:"Press Start 2P", "Courier New", monospace;
  --txt:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--navy);
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 0% 100%, rgba(255,90,20,.16) 0%, transparent 45%), radial-gradient(ellipse at 100% 100%, rgba(127,212,255,.14) 0%, transparent 45%), radial-gradient(ellipse at 50% 0%, #142283 0%, var(--navy) 70%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--txt); font-size:20px; line-height:1.15;
}
#app{max-width:1520px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,.pix{font-family:var(--pix);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000}
h3{font-size:11px;color:var(--dim)}
p{margin:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000, 6px 6px 0 rgba(0,0,0,.45);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--dim)}
.warn{color:var(--gold)}
.bad{color:var(--red)}
.btn{font-family:var(--pix);font-size:11px;line-height:1.3;color:var(--gold);background:var(--deep);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:10px 14px 10px 26px;cursor:pointer;position:relative;text-transform:uppercase;text-align:left}
.btn::before{content:"\25B6";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;opacity:0}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--navy);outline:none}
.btn:hover::before,.btn:focus-visible::before{opacity:1;animation:blink .7s steps(1) infinite}
.btn.primary{background:var(--red);color:#fff;border-color:#ff8a8a #6a0d0d #6a0d0d #ff8a8a}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--gold);color:var(--navy)}
.btn.small{font-size:9px;padding:7px 10px 7px 22px}
.btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--deep);color:var(--dim)}
.btn[disabled]::before{opacity:0}
.btn.on{background:var(--gold);color:var(--navy)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
input,select{font-family:var(--txt);font-size:20px;color:var(--ink);background:var(--lo);border:2px solid var(--hi);padding:4px 8px;min-width:0;max-width:100%}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:18px;color:var(--dim)}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--pix);font-size:13px;color:var(--fire);text-shadow:2px 2px 0 var(--ember),4px 4px 0 #000;cursor:pointer;background:none;border:0;padding:0}
.bar .tname{font-size:22px;color:var(--ink)}
.save{font-family:var(--pix);font-size:8px;color:var(--ok)}
.save.local{color:var(--gold)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* title screen */
.title{align-items:center;text-align:center;gap:22px;padding-block:34px}
.title h1{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:clamp(24px,7.5vw,62px);line-height:1.15;color:var(--fire);pointer-events:none}
.title h1 span{display:block;background:linear-gradient(180deg,#fff3a0 0%,var(--gold) 28%,var(--fire) 62%,var(--ember) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(3px 3px 0 #6a0d0d) drop-shadow(3px 3px 0 #000)}
.title h1 .ice{background:linear-gradient(180deg,#ffffff 0%,var(--ice) 35%,var(--frost) 75%,#3f8fd8 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(3px 3px 0 #0b3a8a) drop-shadow(3px 3px 0 #000)}
.title .sub{font-family:var(--pix);font-size:clamp(11px,2.6vw,16px);color:var(--ice);text-shadow:2px 2px 0 #000;line-height:1.6}
.title .sub .f{color:var(--fire)}.title .sub .i{color:var(--frost)}
.press{font-family:var(--pix);font-size:10px;color:var(--ink);animation:blink 1.2s steps(1) infinite}
.rink{width:min(600px,100%);aspect-ratio:2.2/1;max-width:100%;background:var(--ice);border:4px solid #000;border-radius:60px/27%;position:relative;box-shadow:0 0 0 3px var(--hi)}
.rink i{position:absolute;top:0;bottom:0;width:6px}
.rink .red{left:calc(50% - 3px);background:var(--red)}
.rink .b1{left:33%;background:#2149d8}.rink .b2{right:33%;background:#2149d8}
.rink .g1{left:9%;width:2px;background:var(--red)}.rink .g2{right:9%;width:2px;background:var(--red)}
/* goal nets sit behind each goal line, open toward centre ice, with a blue crease in front */
.rink .net{position:absolute;top:41%;height:18%;width:4.5%;border:3px solid var(--red);background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 1px,transparent 1px 4px),#fff}
.rink .n1{right:calc(91% - 1px);border-right:0;border-radius:6px 0 0 6px}.rink .n2{left:calc(91% - 1px);border-left:0;border-radius:0 6px 6px 0}
.rink .crease{position:absolute;top:41%;height:18%;width:5%;background:rgba(80,140,255,.45);border:2px solid var(--red)}
.rink .c1{left:calc(9% + 2px);border-left:0;border-radius:0 50% 50% 0/0 50% 50% 0}.rink .c2{right:calc(9% + 2px);border-right:0;border-radius:50% 0 0 50%/50% 0 0 50%}
.rink b{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:3px solid #2149d8;border-radius:50%;transform:translate(-50%,-50%)}
.rink .puck{position:absolute;width:14px;height:9px;background:#000;border-radius:50%;top:46%;left:20%;box-shadow:0 0 6px 3px var(--fire),0 0 14px 6px rgba(255,61,31,.55);animation:slide 3.2s ease-in-out infinite alternate,flicker .35s steps(2) infinite}
@keyframes flicker{50%{box-shadow:0 0 4px 2px var(--gold),0 0 18px 8px rgba(255,122,26,.6)}}
@keyframes slide{to{left:76%;top:58%}}
.menu{display:flex;flex-direction:column;gap:10px;min-width:min(320px,100%)}
.menu .btn{font-size:12px}

/* setup */
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{font-family:var(--pix);font-size:9px;padding:6px 8px;border:2px solid var(--hi);color:var(--dim)}
.step.cur{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chip{display:inline-block;width:14px;height:14px;border:2px solid #000;vertical-align:-2px;margin-right:6px}
.confs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.slot .seed{font-family:var(--pix);font-size:9px;color:var(--dim)}
.pair{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px dashed rgba(157,176,255,.35)}
.pair.clash{border-color:var(--gold)}
.orow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:20px}

.slot .btn.mv,.orow .btn.mv{padding:6px 8px;font-size:9px}
.btn.mv::before{display:none}
.draftorder{display:flex;flex-direction:column;gap:8px;max-width:520px}
.dpick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-family:var(--txt);font-size:19px;color:var(--ink);background:var(--deep);border:2px solid var(--panel);padding:5px 8px;cursor:pointer;min-width:0}
.dpick .seed{font-family:var(--pix);font-size:9px;color:var(--gold);min-width:24px}
.dpick:hover:not([disabled]),.dpick:focus-visible{border-color:var(--gold);outline:none;background:var(--panel)}
.dpick.taken{opacity:.6;cursor:default}
.dpick[disabled]{cursor:default}
.clock{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:rgba(0,0,0,.3);border:3px solid var(--gold);padding:10px 14px}
.clock .pix{font-size:10px;color:var(--gold);animation:blink 1.2s steps(1) infinite}
.clock .who{font-family:var(--pix);font-size:16px}
.board{margin:0;padding-left:28px;columns:2 260px;font-size:19px}
.board li{margin-bottom:4px;break-inside:avoid}
.mrow .sd{font-family:var(--pix);font-size:7px;color:var(--dim);min-width:10px}

.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sizebtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;background:var(--deep);color:var(--ink);border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);cursor:pointer;font-family:var(--txt);font-size:18px;text-align:center}
.sizebtn .num{font-family:var(--pix);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 #000}
.sizebtn .pix{font-size:10px}
.sizebtn:hover,.sizebtn:focus-visible{border-color:var(--gold);outline:none}
.sizebtn.on{background:var(--gold);color:var(--navy);border-color:#000}
.sizebtn.on .num{color:var(--navy);text-shadow:none}
.sizebtn.on .muted{color:var(--navy)}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,5,30,.82);display:grid;place-items:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));overflow-y:auto}
.help{width:min(600px,100%);max-height:100%;overflow-y:auto}
.help .hstep{font-family:var(--pix);font-size:9px;color:var(--dim)}
.help h2{font-size:15px;line-height:1.5}
.help ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:20px}
.help li::marker{color:var(--gold)}
.help b{color:var(--gold);font-weight:400}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;background:var(--lo);border:2px solid var(--hi)}
.dots i.on{background:var(--gold);border-color:var(--gold)}

/* team badge with logo */
.team{display:inline-flex;align-items:center;gap:6px;flex:none;vertical-align:middle}
.team .logo{width:30px;height:30px;display:grid;place-items:center;flex:none}
.team .logo svg,.team .logo img{width:100%;height:100%;object-fit:contain;display:block}
.team.big .logo{width:76px;height:76px}
.team.big{gap:10px}

/* team badge */
.badge{display:inline-grid;place-items:center;min-width:46px;height:26px;padding:0 4px;font-family:var(--pix);font-size:9px;color:var(--c2);background:var(--c1);border:2px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);flex:none}
.badge.big{min-width:96px;height:56px;font-size:18px;border-width:3px}

/* bracket */
.bwrap{overflow-x:auto;padding-bottom:6px}
.bracket{display:grid;grid-template-columns:repeat(7,minmax(200px,1fr));gap:12px;min-width:1460px;align-items:stretch}
.bcol{display:flex;flex-direction:column;gap:8px;justify-content:space-around}
.bcol h3{text-align:center;font-size:8px;min-height:20px}
.match{display:flex;flex-direction:column;background:var(--lo);border:2px solid var(--hi);padding:0;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--txt);width:100%}
.match:hover,.match:focus-visible{border-color:var(--gold);outline:none;box-shadow:0 0 0 2px var(--gold)}
.match[disabled]{cursor:default;opacity:.55;box-shadow:none;border-color:var(--hi)}
.mrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center;padding:6px 8px;font-size:18px;min-width:0}
.mrow .team .logo{width:34px;height:34px}
.who2{display:flex;flex-direction:column;gap:3px;min-width:0}
.who2 b{font-family:var(--pix);font-size:8px;font-weight:400;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow + .mrow{border-top:1px solid rgba(157,176,255,.25)}
.mrow .who{font-size:16px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sc{font-family:var(--pix);font-size:12px;min-width:20px;text-align:right}
.mrow.win{background:rgba(248,216,56,.14)}
.mrow.win .sc{color:var(--gold)}
.mrow.lose{opacity:.55}
.mfoot{font-family:var(--pix);font-size:7px;color:var(--dim);padding:4px 6px;background:rgba(0,0,0,.25)}
.mfoot.alert{color:var(--navy);background:var(--gold)}
.cup{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.trophy{width:56px;height:70px;position:relative}
.trophy::before{content:"";position:absolute;left:12px;right:12px;top:0;height:30px;background:linear-gradient(90deg,#9aa4b8,#f1f4fa,#9aa4b8);border-radius:0 0 50% 50%}
.trophy::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:38px;background:repeating-linear-gradient(180deg,#c9d0dd 0 6px,#8c95a8 6px 8px);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.champ{font-family:var(--pix);font-size:10px;color:var(--gold);line-height:1.6}
.banner{background:var(--gold);color:var(--navy);border:3px solid #000;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner .pix{font-size:10px}

/* faceoff */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.vsmid{font-family:var(--pix);font-size:22px;color:var(--red);text-shadow:2px 2px 0 #000;align-self:center}
.side{gap:12px}
.thead{display:flex;gap:12px;align-items:center}
.thead .nm{font-family:var(--pix);font-size:12px;line-height:1.5}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:4px;background:rgba(0,0,0,.25);border:2px solid var(--lo)}
.pbtn{display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;text-align:left;font-family:var(--txt);font-size:18px;color:var(--ink);background:var(--deep);border:2px solid var(--panel);padding:3px 6px;cursor:pointer;min-width:0}
.pbtn .n{font-family:var(--pix);font-size:8px;color:var(--dim)}
.pbtn .p{font-family:var(--pix);font-size:7px;color:var(--dim)}
.pbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn:hover,.pbtn:focus-visible{border-color:var(--gold);outline:none}
.pbtn.sel{background:var(--gold);color:var(--navy);border-color:#000}
.pbtn.sel .n,.pbtn.sel .p{color:var(--navy)}
.pbtn[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:10px 6px;text-align:center;min-width:0}
.pcard h3{font-size:8px}
.shot{width:100%;max-width:120px;aspect-ratio:1;background:linear-gradient(180deg,#9fb6ff,#4f6fd8);border:3px solid #000;position:relative;overflow:hidden;image-rendering:auto}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .head{position:absolute;left:50%;top:16%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--c1);transform:translateX(-50%);border:3px solid #000}
.shot .body{position:absolute;left:14%;right:14%;bottom:-6%;height:42%;background:var(--c1);border:3px solid #000;border-radius:40% 40% 0 0;display:grid;place-items:center;font-family:var(--pix);font-size:16px;color:var(--c2)}
.shot.none{background:repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 6px,transparent 6px 12px),var(--lo)}
.shot.none .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pix);font-size:22px;color:var(--dim)}
.pcard .pn{font-family:var(--pix);font-size:9px;line-height:1.5;color:var(--gold);overflow-wrap:anywhere}
.pcard .pm{font-size:17px;color:var(--dim)}
.score{display:flex;align-items:center;gap:10px}
.score output{font-family:var(--pix);font-size:34px;color:var(--gold);min-width:64px;text-align:center;text-shadow:3px 3px 0 #000}
.issues{display:flex;flex-direction:column;gap:4px;font-size:19px}
details summary{cursor:pointer;color:var(--dim);font-size:18px}
.addp{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px}

/* stats */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th{font-family:var(--pix);font-size:8px;color:var(--gold);text-align:left;padding:8px 8px;border-bottom:3px solid var(--hi);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid rgba(157,176,255,.18);white-space:nowrap}
td.num,th.num{text-align:right}
tr:nth-child(even) td{background:rgba(0,0,0,.18)}
.empty{color:var(--dim);font-size:20px;padding:10px 0}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cand{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--deep);border:2px solid var(--panel);color:var(--ink);font-family:var(--txt);font-size:19px;padding:8px;cursor:pointer}
.cand:hover,.cand:focus-visible{border-color:var(--gold);outline:none}
.cand.sel{background:var(--gold);color:var(--navy)}
.cand b{font-family:var(--pix);font-size:9px;font-weight:400}
.ideas{font-size:19px;display:flex;flex-direction:column;gap:4px}

/* fire and ice: bracket sides and player streaks */
.bcol.fire h3{color:var(--fire)}
.bcol.ice h3{color:var(--frost)}
.bcol.fire .match{border-color:#c4561c}
.bcol.ice .match{border-color:#4f9fd6}
.bcol.fire .match:hover,.bcol.fire .match:focus-visible,.bcol.ice .match:hover,.bcol.ice .match:focus-visible{border-color:var(--gold)}
.bcol.fire .match[disabled],.bcol.fire .match.ro:hover{border-color:#c4561c}
.bcol.ice .match[disabled],.bcol.ice .match.ro:hover{border-color:#4f9fd6}
.fvi{font-family:var(--pix);font-size:8px;color:var(--dim)}
.fvi .f{color:var(--fire)}.fvi .i{color:var(--frost)}
.heat{display:flex;gap:8px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--pix);font-size:8px;padding:5px 8px;border:2px solid #000;white-space:nowrap}
.streak.fire{background:linear-gradient(180deg,var(--gold),var(--fire) 55%,var(--ember));color:#2a0500;animation:flame .5s steps(2) infinite}
.streak.ice{background:linear-gradient(180deg,#fff,var(--frost));color:#05214a}
.streak .nm{font-family:var(--txt);font-size:17px;letter-spacing:0}
@keyframes flame{50%{box-shadow:0 0 10px 2px rgba(255,122,26,.7)}}
.who.hot{text-shadow:0 0 6px var(--fire),0 0 2px var(--ember)}
.who.cold{text-shadow:0 0 6px var(--frost)}

/* shared results (read only) and cup records */
.match.ro{cursor:default}
.match.ro:hover{border-color:var(--hi);box-shadow:none}
.shareurl{width:100%;font-size:17px}

/* game clock: an arena scoreboard on top of the faceoff screen */
.sb{background:#000;border:4px solid;border-color:#3a3a3a #111 #111 #3a3a3a;box-shadow:0 0 0 2px #000,0 6px 0 rgba(0,0,0,.4);padding:12px;display:flex;flex-direction:column;gap:12px}
.sbtop{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.sbteam{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.sbteam .pl{font-family:var(--pix);font-size:9px;color:var(--ice);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbteam .gl{font-family:var(--pix);font-size:clamp(34px,7vw,56px);color:var(--red);text-shadow:0 0 10px rgba(236,58,58,.6);background:#140303;border:2px solid #2a0a0a;min-width:2.2ch;padding:6px 8px 4px;line-height:1}
.sbmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.sbper{font-family:var(--pix);font-size:11px;color:var(--frost)}
.sbclock{font-family:var(--pix);font-size:clamp(30px,7.5vw,60px);color:var(--gold);text-shadow:0 0 12px rgba(248,216,56,.55);background:#171200;border:2px solid #2e2600;padding:8px 10px 6px;line-height:1;font-variant-numeric:tabular-nums}
.sbclock.cd{min-width:3ch;text-align:center;color:var(--ok);text-shadow:0 0 12px rgba(70,214,122,.6)}
.sbclock.low{color:var(--fire);text-shadow:0 0 12px rgba(255,122,26,.7)}
.sbstate{font-family:var(--pix);font-size:8px;color:var(--dim);min-height:10px}
.sbstate.go{color:var(--ok)}
.sbbox{width:auto;margin:0 auto;font-size:18px;background:transparent}
.sbbox th,.sbbox td{text-align:center;padding:4px 10px;border-bottom:1px solid #222;background:transparent!important}
.sbbox th{color:var(--dim);border-bottom:2px solid #333}
.sbbox th:first-child,.sbbox td:first-child{text-align:left}
.sbbox td.cur{color:var(--gold)}
.sbbox td.t{font-family:var(--pix);font-size:11px;color:var(--gold)}
.sbctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.sbctl .muted{font-size:18px;text-align:center}
.lens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lens .btn.sel{background:var(--gold);color:var(--navy)}
.sbenter{display:flex;flex-direction:column;gap:10px;align-items:center;border-top:2px solid #222;padding-top:10px}
.sbenter h3{color:var(--gold);text-align:center}
.sbenter .rows{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.sbenter .rows > div{display:flex;flex-direction:column;align-items:center;gap:6px}
.pertabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pertabs .btn{padding:6px 10px;font-size:9px}
.pertabs .btn.sel{background:var(--gold);color:var(--navy)}
@media (max-width:520px){
  .sbtop{grid-template-columns:1fr 1fr}
  .sbmid{grid-column:1 / -1;order:-1}
}

@media (max-width:760px){
  .vs{grid-template-columns:1fr}
  .vsmid{justify-self:center}
  .bar .tname{font-size:20px;width:100%;order:3}
  .nav{margin-left:0}
}
</style>

/* bracket geometry for 4, 8 or 16 teams. Games are numbered round by round; within a round
   the first half is West and the second half East. The last game (SIZE-2) is the Cup final.
   For 16 teams: 0-7 R1, 8-11 R2, 12-13 conference finals, 14 Cup final. */
const SIZE = () => (state && state.size) || 16;
const CONF = () => SIZE()/2;
const ROUNDS = () => Math.log2(SIZE());
const NGAMES = () => SIZE()-1;
const FINAL = () => SIZE()-2;
const rcount = r => SIZE()/2**(r+1);
const rstart = r => { let s=0; for (let k=0;k<r;k++) s+=rcount(k); return s; };
const roundOf = g => { let r=0; while (r<ROUNDS()-1 && g>=rstart(r+1)) r++; return r; };
const idxIn = g => g - rstart(roundOf(g));
const feeders = g => { const r=roundOf(g); if (r===0) return null; const i=idxIn(g), s=rstart(r-1); return [s+2*i, s+2*i+1]; };
const nextOf = g => { const r=roundOf(g); return r===ROUNDS()-1 ? null : rstart(r+1)+Math.floor(idxIn(g)/2); };
const confOf = g => g===FINAL() ? "F" : (idxIn(g) < rcount(roundOf(g))/2 ? "W" : "E");
const gameNo = g => confOf(g)==="E" ? idxIn(g)-rcount(roundOf(g))/2+1 : idxIn(g)+1;
const roundName = r => ROUND_NAMES[4-ROUNDS()+r];

             : `<div class="shot" style="${c}" aria-hidden="true"><span class="head"></span><span class="body">${esc(num)}</span></div>`;
}

/* round 1 pairings by conference size: 1v8, 4v5, 2v7, 3v6 / 1v4, 2v3 / 1v2 */
const SEEDPAIRS = {8:[[0,7],[3,4],[1,6],[2,5]], 4:[[0,3],[1,2]], 2:[[0,1]]};
function entryOf(g, side){
  if (g<rcount(0)){
    if (state.v<2) return 2*g+side;
    const half = rcount(0)/2, west = g<half;
    return (west?0:CONF()) + SEEDPAIRS[CONF()][west?g:g-half][side];
  }
  const f = feeders(g)[side];
  return winnerEntry(f);
}
function winnerEntry(g){
  const gm = state.games[g];
  if (!gm || gm.status!=="final") return null;
  const w = gm.sides[0].score > gm.sides[1].score ? 0 : 1;
  return entryOf(g, w);
}
function controller(g, side){
  const gm = state.games[g];
  if (gm && gm.sides[side] && gm.sides[side].owner!=null) return gm.sides[side].owner;
  const e = entryOf(g, side);
  return e==null ? null : state.entries[e].owner;
}
function usedSkaters(exceptGid){
  const m = {};
  for (const [gid, gm] of Object.entries(state.games)){
    if (+gid===exceptGid) continue;
    gm.sides.forEach((s,i)=>{ if (s.skater) m[s.skater] = {gid:+gid}; });
  }
  return m;
}
function locked(g){
  const n = nextOf(g);
  return n!=null && !!state.games[n];
}

function migrate(s){
  if (!s.picks){ s.picks = []; s.snake = true; s.draftOrder = []; }
  if (!s.size){ s.size = 16; if (s.stage==="setup") s.step = (s.step||1) + 1; }
}

/* ---------- persistence ---------- */
function persist(){
  if (ro) return;
  state.updatedAt = Date.now();
  syncHistory();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 350);
}
async function pushRemote(){
  if (!myDoc) return;
  try {
    await myDoc.set({ json: JSON.stringify(state), updatedAt: state.updatedAt });
    savedRemote = true;
  } catch(e){ savedRemote = false; }
  const el = $(".save"); if (el) el.outerHTML = saveTag();
}
function saveTag(){
  return savedRemote ? `<span class="save" title="Saved to your claude.ai account">● SAVED</span>`
                     : `<span class="save local" title="Saved in this browser only. Sign in to claude.ai to keep it across devices.">● SAVED ON THIS DEVICE</span>`;
}
function loadLocal(){
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
async function connectDb(){
  try {
    if (!window.claude || !window.claude.use) return;
    /* each viewer gets their own private save under data/users/<their id> */
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!dbNs || !user) return;
    db = dbNs;
    const uid = await user.id();
    if (!uid) return;
    myDoc = db.collection("data/users/"+uid).doc("tournament");
    let snap = await myDoc.get();
    if (!snap.exists && user.isOwner()){
      /* the owner's tournament from before per-person saves */
      try { const old = await db.doc("tournaments/current").get(); if (old.exists) snap = old; } catch(e) {}
    }
    if (snap.exists){
      const d = snap.data();
      const remote = JSON.parse(d.json);
      if (!state || (remote.updatedAt||0) > (state.updatedAt||0)){
        state = remote;
        migrate(state);
        syncHistory();
        try { localStorage.setItem(KEY, d.json); } catch(e) {}
        if (ui.view==="title") render(); else render();
      }
      savedRemote = true;
    } else if (state){
      await pushRemote();
    }
    const el = $(".save"); if (el) el.outerHTML = saveTag();
  } catch(e) { /* stay on local storage */ }
}

/* ---------- cup records ---------- */
/* finished tournaments are kept on this device, one summary each. A player's finish is the
   deepest run of any team they played: 0 Cup winner, 1 runner-up, 2 lost a conference final,
   3 lost a conference semifinal, 4 lost in round 1. */
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch(e){ return []; } }
function saveHistory(h){ try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch(e) {} }
const tid = s => "t"+s.createdAt;
function summary(s){
  const prev = state; state = s; /* the bracket helpers read the global state */
  try {
    if (winnerEntry(FINAL())==null) return null;
    const best = {}, w = {}, l = {};
    for (let g=0; g<NGAMES(); g++){
      const gm = s.games[g]; if (!gm || gm.status!=="final") continue;
      const win = gm.sides[0].score>gm.sides[1].score ? 0 : 1;
      [0,1].forEach(si=>{
        const o = gm.sides[si].owner; if (o==null) return;
        if (si===win) w[o] = (w[o]||0)+1; else l[o] = (l[o]||0)+1;
        const t = si===win ? (g===FINAL() ? 0 : null) : ROUNDS()-roundOf(g);
        if (t!=null && (best[o]==null || t<best[o])) best[o] = t;
      });
    }
    return { id: tid(s), name: s.name, date: s.updatedAt, size: SIZE(),
      players: s.players.map((p,i)=>({ name: p.name, finish: best[i] ?? null, w: w[i]||0, l: l[i]||0 })) };
  } finally { state = prev; }
}
function addToHistory(sm){ const h = loadHistory().filter(x=>x.id!==sm.id); h.push(sm); saveHistory(h); }
function syncHistory(){
  if (ro || !state || state.sample) return;
  const sm = summary(state);
  if (sm) addToHistory(sm);
  else if (loadHistory().some(x=>x.id===tid(state))) saveHistory(loadHistory().filter(x=>x.id!==tid(state)));
}
const finishName = t => t==null ? "—" : t===0 ? "Cup winner" : t===1 ? "Runner-up" : "Out in "+ROUND_NAMES[4-t];

/* ---------- share links ---------- */
/* the whole tournament rides in the link after #r= so no server is needed. "z" means
   compressed, "j" plain JSON for browsers without CompressionStream. */
const b64url = bytes => { let bin = ""; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function packState(s){
  const bytes = new TextEncoder().encode(JSON.stringify(s));
  if (window.CompressionStream){ try { return "z"+b64url(await pipe(bytes, new CompressionStream("deflate-raw"))); } catch(e) {} }
  return "j"+b64url(bytes);
}
async function unpackState(str){
  const bytes = Uint8Array.from(atob(str.slice(1).replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
  const raw = str[0]==="z" ? await pipe(bytes, new DecompressionStream("deflate-raw")) : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}

/* bracket */
function matchCard(g){
  const gm = state.games[g];
  const ents = [entryOf(g,0), entryOf(g,1)];
  const ready = ents[0]!=null && ents[1]!=null;
  const final = gm && gm.status==="final";
  const win = final ? (gm.sides[0].score>gm.sides[1].score?0:1) : null;
  const ctrl = [controller(g,0), controller(g,1)];
  const clash = ready && !final && ctrl[0]!=null && ctrl[0]===ctrl[1];
  const rows = [0,1].map(s=>{
    const e = ents[s]; const ent = e!=null ? state.entries[e] : null;
    const who = ent ? state.players[ctrl[s]] : null;
    const pick = gm && gm.sides[s].skater ? " · "+esc(pName(gm.sides[s].skater).split(" ").slice(-1)[0]) : "";
    return `<div class="mrow${final?(win===s?" win":" lose"):""}"><span class="sd">${e!=null&&state.v>=2?e%CONF()+1:""}</span><span class="team"><span class="logo">${logo(ent&&ent.team)}</span></span>
      <span class="who2"><b>${ent?esc(TEAMS[ent.team][1]).toUpperCase():"TBD"}</b><span class="who${who?{fire:" hot",ice:" cold"}[(streak(ctrl[s])||{}).kind]||"":""}" style="color:${who?PCOLORS[ctrl[s]]:"var(--dim)"}">${who?esc(who.name)+pick:"Winner of G"+(feeders(g)[s]+1)}</span></span>
      <span class="sc">${final?gm.sides[s].score:""}</span></div>`;
  }).join("");
  if (ro) return `<div class="match ro">${rows}<div class="mfoot">G${g+1} · ${final?`FINAL${gm.ot?" / OT":""}`:ready?"NOT PLAYED YET":"WAITING"}</div></div>`;
  const foot = final ? `FINAL${gm.ot?" / OT":""}` : clash ? "SAME PLAYER · TAP TO SWAP" : gm ? "LINEUP SET" : ready ? "TAP TO PLAY" : "WAITING";
  return `<button class="match" data-act="open" data-g="${g}"${ready?"":" disabled"} aria-label="Game ${g+1}">${rows}<div class="mfoot${clash?" alert":""}">G${g+1} · ${foot}</div></button>`;
}
function vBracket(){
  const col = (title, ids, side) => `<div class="bcol${side?" "+side:""}"><h3>${title}</h3>${ids.map(matchCard).join("")}</div>`;
  const F = FINAL();
  const champE = winnerEntry(F);
  const champ = champE!=null ? state.entries[champE] : null;
  const champOwner = champ ? state.players[controller(F, state.games[F].sides[0].score>state.games[F].sides[1].score?0:1)] : null;
  const cupCol = `<div class="bcol"><h3>STANLEY CUP FINAL</h3><p class="fvi" style="text-align:center"><span class="f">FIRE</span> VS <span class="i">ICE</span></p>${matchCard(F)}
    <div class="cup"><div class="trophy" aria-hidden="true"></div>
    ${champ?`<p class="champ">${esc(TEAMS[champ.team][0]+" "+TEAMS[champ.team][1]).toUpperCase()}<br>WIN THE CUP!</p><p>${esc(champOwner.name)} takes it.</p>
      ${ro&&!state.conn?"":`<button class="btn small" data-act="go" data-v="conn">${state.conn?"Conn Smythe: "+esc(pName(state.conn)):"Pick the Conn Smythe"}</button>`}`:`<p class="muted">Champion crowned here</p>`}
    </div></div>`;
  const R = ROUNDS();
  const half = (r, west) => { const s=rstart(r), h=rcount(r)/2; return Array.from({length:h},(_,i)=>s+(west?i:h+i)); };
  const label = (r, west) => (west?"FIRE · WEST":"ICE · EAST")+" · "+["ROUND 1","SEMIS","FINAL"][r+4-R];
  const west = [], east = [];
  for (let r=0; r<R-1; r++){ west.push(col(label(r,true), half(r,true), "fire")); east.unshift(col(label(r,false), half(r,false), "ice")); }
  const ncols = 2*(R-1)+1;
  return `<section class="panel">
    <div class="row"><h2>PLAYOFF BRACKET · ${SIZE()} TEAMS</h2><span class="grow"></span><span class="muted">${ro?"Shared results. Only the host can enter scores.":"Tap a game to set lineups and enter the score."}</span></div>
    ${(h=>h?`<div class="heat">${h}</div>`:"")(state.players.map((_,i)=>streakTag(i,true)).join(""))}
    <div class="bwrap"><div class="bracket" style="grid-template-columns:repeat(${ncols},minmax(200px,1fr));min-width:${ncols*210}px">
      ${west.join("")}${cupCol}${east.join("")}
    </div></div>
  </section>`;
}

function openGame(g){
  const gm = state.games[g];
  ui.gid = g; ui.editPer = null; ui.sbReset = false;

function draftIssues(g){
  const d = ui.draft, out = [];
  if (d.sides[0].owner===d.sides[1].owner) out.push("Same person on both sides. Hand one team to someone else.");
  d.sides.forEach((s,i)=>{ const t = teamName(state.entries[entryOf(g,i)].team);
    if (!s.skater) out.push(`${t}: pick a skater.`);
    if (!s.goalie) out.push(`${t}: pick a goalie.`); });
  if (d.clock && d.clock.phase!=="done") out.push("The game clock is still going. Finish the periods first.");
  else if (d.sides[0].score===d.sides[1].score) out.push("No ties in the playoffs. Someone has to win.");

/* game clock: pick a period length, run the clock like an arena scoreboard, punch in each
   period's goals at the horn. Tied after 3 periods means sudden-death OT: next goal wins.
   d.clock.phase: "play" (a regulation period is on), "break" (period over, enter its goals),
   "ot" (sudden death, clock counts up), "done" (game over). d.periods holds [side0, side1] goals per period. */
const PERIODS = 3, LENGTHS = [5,10,15,20];
const perName = p => p>=PERIODS ? "OT" : ["1ST","2ND","3RD"][p];
const regGoals = (d, s) => d.periods.reduce((t,pg)=>t+pg[s], 0);

  d.sides.forEach((sd,s)=>{ sd.score = regGoals(d,s) + (d.otWin===s ? 1 : 0); });
  d.ot = d.otWin!=null;
}
function clockMs(c){
  if (c.phase==="ot") return (c.base||0) + (c.at ? Date.now()-c.at : 0);
  return Math.max(0, (c.left||0) - (c.at ? Date.now()-c.at : 0));

function fmtClock(ms, up){

}
let audio = null, wakeLock = null;
function horn(){
  try {
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const t = audio.currentTime, g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.05);
    g.gain.setValueAtTime(0.25, t+1.2); g.gain.exponentialRampToValueAtTime(0.0001, t+1.5);
    g.connect(audio.destination);
    [110, 138.6, 165].forEach(f=>{ const o = audio.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.connect(g); o.start(t); o.stop(t+1.55); });
  } catch(e) {}
  if (navigator.vibrate) try { navigator.vibrate([400,150,400]); } catch(e) {}
}
function beep(){
  try {
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const t = audio.currentTime, g = audio.createGain(), o = audio.createOscillator();
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
    o.type = "square"; o.frequency.value = 880; o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+0.16);
  } catch(e) {}
}
/* every period (and OT) opens with a 10 second countdown so players can tap start and get in position */
const COUNTDOWN = 10000;
function startCountdown(c){ c.at = null; c.cd = Date.now() + COUNTDOWN; ui.lastBeep = null; keepAwake(true); }
function keepAwake(on){
  try {
    if (on && !wakeLock && navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{ wakeLock=l; l.addEventListener("release",()=>{ wakeLock=null; }); }).catch(()=>{});
    else if (!on && wakeLock){ wakeLock.release(); wakeLock=null; }
  } catch(e) {}
}
function autosave(){
  const g = ui.gid, cur = state.games[g];
  if (cur && cur.status==="final") return;
  state.games[g] = JSON.parse(JSON.stringify({ ...ui.draft, status:"lineup" })); persist();
}
function pauseClock(c){ if (!c.at) return; if (c.phase==="ot") c.base = clockMs(c); else c.left = clockMs(c); c.at = null; }
function endPeriod(d, buzz){
  const c = d.clock; c.left = 0; c.at = null; c.phase = "break"; ui.editPer = c.per;
  if (buzz) horn(); keepAwake(false); autosave();

/* after any goal change: an OT winner only counts while regulation is tied */
function settle(d){
  const c = d.clock, tied = regGoals(d,0)===regGoals(d,1);

  if (c.phase==="done" && tied && d.otWin==null){ c.phase = "break"; c.per = PERIODS-1; }
  syncScore(d);
}
setInterval(()=>{
  if (ui.view!=="game" || !ui.draft || !ui.draft.clock) return;
  const c = ui.draft.clock;
  if (c.cd){
    const left = c.cd - Date.now();
    if (left<=0){ c.at = c.cd; c.cd = null; horn(); autosave(); keepScroll(); return; }
    const n = Math.ceil(left/1000);
    if (n<=3 && ui.lastBeep!==n){ ui.lastBeep = n; beep(); }
    const el = $(".sbclock"); if (el) el.textContent = n;
    return;
  }
  if (!c.at) return;
  const ms = clockMs(c);
  if (c.phase==="play" && ms<=0){ endPeriod(ui.draft, true); keepScroll(); return; }
  const el = $(".sbclock"); if (el){ el.textContent = fmtClock(ms, c.phase==="ot"); el.classList.toggle("low", c.phase==="play" && ms<60000); }
}, 250);

/* stats */
function finals(){
  const out = [];
  for (let g=0; g<NGAMES(); g++){
    const gm = state.games[g];
    if (!gm || gm.status!=="final") continue;
    [0,1].forEach(s=>{
      const e = entryOf(g,s);
      out.push({ g, s, e, team: state.entries[e].team, owner: gm.sides[s].owner, skater: gm.sides[s].skater, goalie: gm.sides[s].goalie,
        gf: gm.sides[s].score, ga: gm.sides[1-s].score, win: gm.sides[s].score>gm.sides[1-s].score, ot: gm.ot });
    });
  }
  return out;
}
/* a player's current run: 2+ wins in a row puts them on fire, 2+ losses in a row leaves them ice cold.
   Games count in the order their scores went in (older saves fall back to bracket order). */
function streak(i){
  const r = finals().filter(x=>x.owner===i)
    .sort((a,b)=>(state.games[a.g].at||0)-(state.games[b.g].at||0) || a.g-b.g);
  if (!r.length) return null;
  const last = r[r.length-1].win; let n = 0;
  for (let k=r.length-1; k>=0 && r[k].win===last; k--) n++;
  return n>=2 ? { kind: last?"fire":"ice", n } : null;
}
const streakTag = (i, withName) => { const st = streak(i); if (!st) return "";
  return `<span class="streak ${st.kind}">${st.kind==="fire"?"ON FIRE":"ICE COLD"} ×${st.n}${withName?` <span class="nm">${esc(state.players[i].name)}</span>`:""}</span>`; };

function table(head, rows){
  if (!rows.length) return `<p class="empty">Nothing here yet.</p>`;
  return `<table><thead><tr>${head.map((h,i)=>`<th${i>1?' class="num"':""}>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>1?' class="num"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function isAlive(ei){
  for (let g=0; g<NGAMES(); g++){
    const gm = state.games[g];
    if (gm && gm.status==="final"){ const w = winnerEntry(g); if ((entryOf(g,0)===ei || entryOf(g,1)===ei) && w!==ei) return false; }
  }
  return true;
}

/* cup records: every finished tournament saved on this device, totalled by player name */
function vRecords(){
  const h = loadHistory().sort((a,b)=>b.date-a.date);
  const m = {};
  h.forEach(t=>t.players.forEach(p=>{
    const nm = String(p.name||"").trim(), k = nm.toLowerCase(); if (!k) return;
    const r = m[k] = m[k] || { name:nm, n:0, cups:0, second:0, cf:0, w:0, l:0, best:null };
    r.n++; r.w += p.w; r.l += p.l;
    if (p.finish===0) r.cups++; else if (p.finish===1) r.second++; else if (p.finish===2) r.cf++;
    if (p.finish!=null && (r.best==null || p.finish<r.best)) r.best = p.finish;
  }));
  const rows = Object.values(m).sort((a,b)=>b.cups-a.cups||b.second-a.second||b.cf-a.cf||(b.w-b.l)-(a.w-a.l));
  const date = d => new Date(d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  const who = (t, f) => t.players.filter(p=>p.finish===f).map(p=>esc(p.name)).join(", ") || "—";
  const past = h.map(t=>`<tr><td>${esc(t.name)}</td><td>${date(t.date)}</td><td>${who(t,0)}</td><td>${who(t,1)}</td><td class="num">${t.size}</td><td>${
    ui.confirmDel===t.id ? `<button class="btn small primary" data-act="delrec" data-id="${esc(t.id)}" data-sure="1">Yes, remove</button> <button class="btn small" data-act="cancelDel">Keep</button>`
                         : `<button class="btn small" data-act="delrec" data-id="${esc(t.id)}">Remove</button>`}</td></tr>`).join("");
  return `<section class="panel"><h2>CUP RECORDS</h2>
    ${rows.length ? table(["Player","Best finish","Cups","2nd","Conf. final","Played","W","L"],
        rows.map(r=>[esc(r.name),finishName(r.best),r.cups,r.second,r.cf,r.n,r.w,r.l]))
      : `<p class="empty">No finished tournaments yet. When a Stanley Cup Final is played, everyone's finish is saved here.</p>`}
    <p class="muted">Kept on this device. Players are matched by name, so spell names the same way each time. When someone sends you a results link, open it and tap "Add to my cup records".</p>
  </section>
  ${h.length?`<section class="panel"><h2>PAST TOURNAMENTS</h2><div class="tscroll"><table><thead><tr><th>Tournament</th><th>Date</th><th>Champion</th><th>Runner-up</th><th class="num">Teams</th><th></th></tr></thead><tbody>${past}</tbody></table></div></section>`:""}`;
}

function vShare(){
  return `<section class="panel"><h2>SHARE THE RESULTS</h2>
    <p>Send this link to the group. Anyone who opens it sees the bracket and stats on their own device, and nothing they do changes your tournament.</p>
    <p class="muted">The link is a snapshot of right now. After more games are played, come back here and send a new link.</p>
    ${ui.shareUrl ? `<input class="shareurl" readonly value="${esc(ui.shareUrl)}" aria-label="Share link" onclick="this.select()">
      <div class="row"><button class="btn primary" data-act="copyshare">${ui.copied?"Copied!":"Copy link"}</button>
      ${navigator.share?`<button class="btn" data-act="sendshare">Send…</button>`:""}</div>`
      : `<p class="muted">Making the link…</p>`}
  </section>`;
}
function vSharedBanner(){
  const sm = summary(state);
  const have = sm && loadHistory().find(x=>x.id===sm.id);
  const when = new Date(state.updatedAt).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  return `<div class="banner"><span class="pix">SHARED RESULTS</span><span>Snapshot from ${esc(when)}. Look around. Nothing here can be changed.</span>
    ${sm?(have&&have.date===sm.date?`<span class="pix">IN YOUR RECORDS ✓</span>`:`<button class="btn small" data-act="addrec">${have?"Update":"Add to"} my cup records</button>`):""}
    <button class="btn small" data-act="exitview">Exit</button></div>`;
}

/* Conn Smythe */
function vConn(){
  const ce = winnerEntry(FINAL());
  if (ce==null) return `<section class="panel"><p class="empty">Finish the Stanley Cup Final first.</p></section>`;
  const F = finals().filter(x=>x.e===ce);
  const sk = F.filter(x=>x.skater).map(x=>({id:x.skater, line:`${x.gf} team goals in G${x.g+1} (${x.win?"W":"L"} ${x.gf}–${x.ga})`, rank:x.gf}));
  const gm = {}; F.forEach(x=>{ if(!x.goalie) return; const k=x.goalie; gm[k]=gm[k]||{id:k,gp:0,w:0,ga:0}; gm[k].gp++; gm[k].w+=x.win?1:0; gm[k].ga+=x.ga; });
  const gl = Object.values(gm).map(r=>({id:r.id, line:`${r.w}-${r.gp-r.w}, ${(r.ga/r.gp).toFixed(2)} GAA`, rank:r.w*3-r.ga/r.gp}));
  const all = sk.concat(gl).sort((a,b)=>b.rank-a.rank);
  const team = state.entries[ce].team;
  return `<section class="panel"><div class="row"><h2>CONN SMYTHE TROPHY</h2><span class="grow"></span><button class="btn small" data-act="go" data-v="bracket">Back to bracket</button></div>
    <div class="row">${badge(team,true)}<p>Playoff MVP for the ${esc(TEAMS[team][0]+" "+TEAMS[team][1])}. Pick from the players they used this tournament. They're listed best first by the numbers.</p></div>
    <div class="cands">${all.map(c=>`<button class="cand${state.conn===c.id?" sel":""}" data-act="conn" data-id="${esc(c.id)}"><b>${esc(pName(c.id))} · ${esc(pPos(c.id))}</b><span>${esc(c.line)}</span></button>`).join("")}</div>
    ${state.conn?`<div class="banner"><span class="pix">CONN SMYTHE</span><span>${esc(pName(state.conn))}</span></div>`:""}
  </section>`;
}

/* ---------- actions ---------- */
function onClock(p){
  const n = state.players.length, order = state.draftOrder;
  const round = Math.floor(p/n), pos = p%n;
  return order[state.snake && round%2 ? n-1-pos : pos];
}
/* the draft sets the seeds: a team taken goes into its conference's next open seed */
function takeTeam(ei){
  const E = state.entries, off = ei<CONF()?0:CONF(), P = state.picks.map(i=>E[i]);
  let k = off; while (E[k].owner!=null) k++;
  const [e] = E.splice(ei,1); E.splice(k,0,e);
  e.owner = onClock(P.length); P.push(e);
  state.picks = P.map(x=>E.indexOf(x));
}
function resetDraft(){
  state.picks = []; state.entries.forEach(e=>e.owner=null);
}
function fixOrder(){
  const n = state.players.length;
  if (!state.draftOrder || state.draftOrder.length!==n || state.draftOrder.some(i=>i>=n)) state.draftOrder = Array.from({length:n},(_,i)=>i);
}
function dealOwners(){
  const n = state.players.length;
  const base = Array.from({length:SIZE()},(_,i)=>i%n);
  for (let t=0; t<800; t++){
    const o = shuffle(base);
    let ok = true; for (let k=0;k<rcount(0);k++) if (o[entryOf(k,0)]===o[entryOf(k,1)]) { ok=false; break; }
    if (ok || t===799){ o.forEach((v,i)=>state.entries[i].owner=v); return; }
  }
}
function randomConf(off, rep){
  const list = off===0?WEST:EAST;
  const pick = rep ? Array.from({length:CONF()},()=>list[Math.floor(Math.random()*list.length)]) : shuffle(list).slice(0,CONF());
  pick.forEach((t,i)=>state.entries[off+i].team=t);
}
function loadSample(){
  state = blank(); state.sample = true; state.name = "Sample Cup"; state.stage = "bracket";
  state.players = [{name:"Alex"},{name:"Jordan"},{name:"Sam"}];
  randomConf(0); randomConf(CONF()); state.draftOrder = shuffle([0,1,2]);
  while (state.picks.length<SIZE()){ const left=state.entries.map((e,i)=>i).filter(i=>state.entries[i].owner==null); takeTeam(left[Math.floor(Math.random()*Math.min(3,left.length))]); }
  for (const g of [0,1,4,5,2]){
    const sides = [0,1].map(s=>{ const ros = roster(state.entries[entryOf(g,s)].team); const used = usedSkaters(-1);
      const sk = shuffle(ros.filter(p=>!p.g && !used[p.id]))[0]; const gl = shuffle(ros.filter(p=>p.g))[0];
      return { owner: controller(g,s), skater: sk.id, goalie: gl.id, score: Math.floor(Math.random()*5) }; });
    if (sides[0].score===sides[1].score) sides[Math.round(Math.random())].score++;
    state.games[g] = { status:"final", ot: Math.random()<.2, sides };
  }
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (ro && !["home","go","tab","addrec","exitview","delrec","cancelDel","help","helpnav","helpclose"].includes(a)) return;
  if (a==="home" && ro){ ui.view="bracket"; }
  else if (a==="help"){ ui.help = 0; }
  else if (a==="helpnav"){ ui.help = Math.max(0, Math.min(HELP.length-1, ui.help + (+b.dataset.d))); }
  else if (a==="helpclose"){ closeHelp(); }
  else if (a==="home"){ ui.view="title"; ui.confirmNew=false; ui.notice=""; }
  else if (a==="continue"){ ui.view = state.stage==="bracket" ? "bracket" : "setup"; }
  else if (a==="new"){
    const exists = state && (state.stage==="bracket" || state.entries.some(e=>e.team)) && !state.sample;
    if (exists && !b.dataset.sure){ ui.confirmNew = "new"; }
    else { state = blank(); ui.confirmNew=false; ui.view="setup"; persist(); }
  }
  else if (a==="cancelNew"){ ui.confirmNew=false; }
  else if (a==="sample"){
    if (state && !state.sample && (state.stage==="bracket" || state.entries.some(e=>e.team)) && !b.dataset.sure){ ui.confirmNew="sample"; }
    else { loadSample(); ui.confirmNew=false; ui.view="bracket"; persist(); }
  }
  else if (a==="go"){ ui.view = b.dataset.v; }
  else if (a==="nplayers"){
    const n = +b.dataset.n; while (state.players.length<n) state.players.push({name:"Player "+(state.players.length+1)});
    state.players.length = n; fixOrder(); resetDraft(); persist();
  }
  else if (a==="step"){ state.step = +b.dataset.s; persist(); window.scrollTo(0,0); }
  else if (a==="randconf"){ randomConf(+b.dataset.c, !!b.dataset.rep); resetDraft(); persist(); }
  else if (a==="randall"){ randomConf(0); randomConf(CONF()); resetDraft(); persist(); }
  else if (a==="size"){ const n=+b.dataset.n; if (n!==SIZE()){ state.size=n; state.entries=Array.from({length:n},()=>({team:null,owner:null})); state.games={}; state.conn=null; resetDraft(); persist(); } }
  else if (a==="clearteams"){ state.entries.forEach(e=>e.team=null); resetDraft(); persist(); }
  else if (a==="randorder"){ fixOrder(); state.draftOrder = shuffle(state.draftOrder); resetDraft(); persist(); }
  else if (a==="ordmove"){ const k=+b.dataset.k, j=k+(+b.dataset.d); const O=state.draftOrder; [O[k],O[j]]=[O[j],O[k]]; resetDraft(); persist(); }
  else if (a==="snake"){ state.snake = b.dataset.v==="1"; resetDraft(); persist(); }
  else if (a==="draft"){ const ei=+b.dataset.i; if (state.entries[ei].owner==null && state.picks.length<SIZE()){ takeTeam(ei); persist(); } }
  else if (a==="undopick"){ const ei=state.picks.pop(); if (ei!=null) state.entries[ei].owner=null; persist(); }
  else if (a==="autodraft"){ while (state.picks.length<SIZE()){ const left=state.entries.map((e,i)=>i).filter(i=>state.entries[i].owner==null); takeTeam(shuffle(left)[0]); } persist(); }
  else if (a==="start"){ state.stage="bracket"; ui.view="bracket"; persist(); window.scrollTo(0,0); }
  else if (a==="open"){ openGame(+b.dataset.g); return; }
  else if (a==="pick"){ const s=+b.dataset.s, k=b.dataset.k; ui.draft.sides[s][k] = ui.draft.sides[s][k]===b.dataset.id ? null : b.dataset.id; keepScroll(); return; }
  else if (a==="score"){ const s=+b.dataset.s; ui.draft.sides[s].score = Math.max(0, Math.min(99, ui.draft.sides[s].score + (+b.dataset.d))); keepScroll(); return; }
  else if (a==="plen"){ state.periodLen = +b.dataset.m; persist(); keepScroll(); return; }
  else if (a==="clockgo"){ if (!lineupSet(ui.draft)) return; const len = state.periodLen || 10, d = ui.draft;
    d.periods = Array.from({length:PERIODS}, ()=>[0,0]); d.otWin = null;
    d.clock = { len, per:0, phase:"play", left:len*60000, at:null }; syncScore(d);
    try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); audio.resume(); } catch(e) {}
    startCountdown(d.clock); autosave(); keepScroll(); return; }
  else if (a==="cdskip"){ const c = ui.draft.clock; c.at = Date.now(); c.cd = null; horn(); autosave(); keepScroll(); return; }
  else if (a==="clockpause"){ pauseClock(ui.draft.clock); keepAwake(false); autosave(); keepScroll(); return; }
  else if (a==="clockrun"){ const c = ui.draft.clock; c.at = Date.now(); try { audio && audio.resume(); } catch(e) {} keepAwake(true); keepScroll(); return; }
  else if (a==="clockend"){ endPeriod(ui.draft, false); keepScroll(); return; }
  else if (a==="nextper"){ const c = ui.draft.clock; c.per++; c.phase="play"; c.left=c.len*60000; ui.editPer=null; startCountdown(c); autosave(); keepScroll(); return; }
  else if (a==="startot"){ const c = ui.draft.clock; c.per=PERIODS; c.phase="ot"; c.base=0; ui.editPer=null; startCountdown(c); autosave(); keepScroll(); return; }
  else if (a==="otgoal"){ const d = ui.draft; pauseClock(d.clock); d.otWin = +b.dataset.s; d.clock.phase="done"; syncScore(d); horn(); keepAwake(false); autosave(); keepScroll(); return; }
  else if (a==="gameover"){ ui.draft.clock.phase="done"; ui.editPer=null; autosave(); keepScroll(); return; }
  else if (a==="editper"){ ui.editPer = +b.dataset.p; keepScroll(); return; }
  else if (a==="pgoal"){ const d = ui.draft, pg = d.periods[+b.dataset.p], s = +b.dataset.s;
    pg[s] = Math.max(0, Math.min(99, pg[s] + (+b.dataset.d))); settle(d); autosave(); keepScroll(); return; }
  else if (a==="clockreset"){ if (!b.dataset.sure){ ui.sbReset = true; keepScroll(); return; }
    const d = ui.draft; delete d.clock; delete d.periods; delete d.otWin; d.ot=false; d.sides.forEach(sd=>sd.score=0);
    ui.sbReset = false; keepAwake(false); autosave(); keepScroll(); return; }
  else if (a==="clockkeep"){ ui.sbReset = false; keepScroll(); return; }
  else if (a==="addp"){
    const s=b.dataset.s, t=b.dataset.t, name=$("#aname"+s).value.trim().replace(/[|;]/g,""), num=$("#anum"+s).value.replace(/\D/g,""), pos=$("#apos"+s).value;
    if (!name) { $("#aname"+s).focus(); return; }
    state.custom[t] = state.custom[t]||[]; state.custom[t].push(pos+"|"+num+"|"+name); persist(); keepScroll(); return;
  }
  else if (a==="savelineup"){ const d=ui.draft; d.status = state.games[ui.gid]&&state.games[ui.gid].status==="final" ? "final" : "lineup";
    if (d.status==="final" && draftIssues(ui.gid).length) d.status="lineup";
    state.games[ui.gid]=JSON.parse(JSON.stringify(d)); persist(); ui.view="bracket"; }
  else if (a==="final"){ ui.draft.status="final"; ui.draft.at = ui.draft.at || Date.now(); state.games[ui.gid]=JSON.parse(JSON.stringify(ui.draft)); persist();
    ui.view = ui.gid===FINAL() ? "conn" : "bracket"; }
  else if (a==="cleargame"){ delete state.games[ui.gid]; persist(); ui.view="bracket"; }
  else if (a==="tab"){ ui.tab=b.dataset.t; }
  else if (a==="conn"){ state.conn = b.dataset.id; persist(); }
  else if (a==="share"){
    ui.view="share"; ui.shareUrl=null; ui.copied=false;
    packState(state).then(d=>{ ui.shareUrl = location.origin+location.pathname+"#r="+d; if (ui.view==="share") render(); });
  }
  else if (a==="copyshare"){
    const done = () => { ui.copied=true; if (ui.view==="share") render(); };
    if (navigator.clipboard) navigator.clipboard.writeText(ui.shareUrl).then(done, ()=>$(".shareurl").select());
    else $(".shareurl").select();
    return;
  }
  else if (a==="sendshare"){ navigator.share({ title: state.name, text: state.name+" results", url: ui.shareUrl }).catch(()=>{}); return; }
  else if (a==="addrec"){ const sm = summary(state); if (sm) addToHistory(sm); }
  else if (a==="delrec"){
    if (b.dataset.sure){ saveHistory(loadHistory().filter(x=>x.id!==b.dataset.id)); ui.confirmDel=null; }
    else ui.confirmDel = b.dataset.id;
  }
  else if (a==="cancelDel"){ ui.confirmDel=null; }
  else if (a==="exitview"){ history.replaceState(null, "", location.pathname+location.search); bootLocal(); return; }
  render();
});
function keepScroll(){
  const lists = [...document.querySelectorAll(".plist")].map(el=>el.scrollTop);
  const y = window.scrollY; render(); window.scrollTo(0,y);
  document.querySelectorAll(".plist").forEach((el,i)=>el.scrollTop=lists[i]||0);
}
document.addEventListener("keydown", ev => {
  if (ui.help==null) return;
  if (ev.key==="Escape"){ closeHelp(); render(); }
  else if (ev.key==="ArrowRight" && ui.help<HELP.length-1){ ui.help++; render(); }
  else if (ev.key==="ArrowLeft" && ui.help>0){ ui.help--; render(); }
});
document.addEventListener("change", ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  if (k==="team"){ state.entries[+t.dataset.i].team = t.value||null; resetDraft(); persist(); render(); }
  else if (k==="ctrl"){ ui.draft.sides[+t.dataset.s].owner = +t.value; keepScroll(); }
  else if (k==="ot"){ ui.draft.ot = t.checked; }
});
document.addEventListener("input", ev => {
  const t = ev.target, k = t.dataset.in; if (!k) return;
  if (k==="tname"){ state.name = t.value || "Tournament"; persist(); const n=$(".bar .tname"); if (n) n.textContent=state.name; }
  else if (k==="pname"){ state.players[+t.dataset.i].name = t.value || "Player "+(+t.dataset.i+1); persist(); }
});

/* boot: a link with #r= opens someone's shared results read only, otherwise this device's tournament */
function bootLocal(){
  ro = false; state = loadLocal() || blank(); migrate(state); syncHistory();
  try { if (!localStorage.getItem(HELP_KEY)) ui.help = 0; } catch(e) {}
  ui.view = "title"; render(); window.scrollTo(0,0);
  if (!db) connectDb();
}
const shared = /^#r=(.+)$/.exec(location.hash);
if (shared){
  ro = true;
  $("#app").innerHTML = `<section class="panel"><p class="empty">Opening shared results…</p></section>`;
  unpackState(shared[1]).then(s=>{ state = s; migrate(state); ui.view = "bracket"; render(); })
    .catch(()=>{ history.replaceState(null, "", location.pathname+location.search); bootLocal();
      ui.notice = "That results link didn't open. It may have been cut short when it was copied, so ask for it again."; render(); });
} else bootLocal();
window.addEventListener("hashchange", ()=>{ if (/^#r=/.test(location.hash)) location.reload(); });
</script>
